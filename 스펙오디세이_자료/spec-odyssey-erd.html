<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스펙 오디세이 ERD 검수판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sea:#0E1A24; --sea-2:#13232F; --grid:rgba(255,255,255,.055);
  --paper:#FBFAF7; --paper-2:#F1EEE8; --ink:#152029; --ink-soft:#5C6B77;
  --line:#D8D2C8; --edge:#4E6B7E; --edge-hi:#F2C879;
  --g-user:#2E7D6B; --g-job:#B03A48; --g-road:#7A5CB8;
  --g-mission:#B5841B; --g-eval:#2B6CB0; --g-sys:#5A6472;
  --sans:'IBM Plex Sans KR',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
:root:not([data-theme="light"]){color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--sea);font-family:var(--sans);color:var(--paper);overflow:hidden;-webkit-text-size-adjust:100%}

/* ---------- top bar ---------- */
#bar{position:fixed;top:0;left:0;right:0;height:56px;z-index:30;display:flex;align-items:center;gap:18px;
  padding:0 18px;background:linear-gradient(180deg,rgba(14,26,36,.97),rgba(14,26,36,.82));backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(255,255,255,.08)}
#bar h1{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em;white-space:nowrap}
#bar h1 span{color:#8FA6B4;font-weight:400;margin-left:8px;font-size:13px}
#search{flex:0 1 260px;min-width:120px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  border-radius:6px;color:var(--paper);font-family:var(--sans);font-size:13px;padding:7px 10px}
#search::placeholder{color:#7A8D9B}
#search:focus{outline:2px solid var(--edge-hi);outline-offset:1px}
#legend{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.lg{display:flex;align-items:center;gap:5px;font-size:11.5px;color:#A9BCC8;background:rgba(255,255,255,.05);
  border:1px solid transparent;border-radius:20px;padding:4px 10px;cursor:pointer;font-family:var(--sans)}
.lg:hover{background:rgba(255,255,255,.1)}
.lg[aria-pressed="true"]{border-color:currentColor;color:var(--paper);background:rgba(255,255,255,.12)}
.lg i{width:9px;height:9px;border-radius:2px;display:block}
#zoomer{display:flex;gap:4px;align-items:center}
.zb{width:30px;height:30px;border-radius:6px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  color:var(--paper);font-size:15px;cursor:pointer;line-height:1;font-family:var(--sans)}
.zb:hover{background:rgba(255,255,255,.14)}
.zb.wide{width:auto;padding:0 10px;font-size:12px}
#pct{font-size:11.5px;color:#8FA6B4;width:42px;text-align:center;font-family:var(--mono)}

/* ---------- canvas ---------- */
#stage{position:fixed;inset:56px 0 0 0;overflow:hidden;cursor:grab;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px}
#stage.drag{cursor:grabbing}
#world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#wires{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
.wire{fill:none;stroke:var(--edge);stroke-width:1.6;opacity:.55}
.wire.on{stroke:var(--edge-hi);stroke-width:2.6;opacity:1}
.wcap{fill:var(--edge);font-size:10px;font-family:'IBM Plex Mono',monospace;opacity:.6}
.wcap.on{fill:var(--edge-hi);opacity:1}

/* ---------- table card ---------- */
.tb{position:absolute;width:266px;background:var(--paper);color:var(--ink);border-radius:7px;
  box-shadow:0 10px 22px rgba(0,0,0,.42);overflow:hidden;cursor:grab;user-select:none}
.tb.dim{opacity:.22}
.tb.sel{box-shadow:0 0 0 3px var(--edge-hi),0 14px 30px rgba(0,0,0,.5)}
.th{padding:9px 11px;color:#fff;display:flex;align-items:baseline;gap:7px}
.th b{font-size:12.5px;font-family:var(--mono);font-weight:600;letter-spacing:.01em}
.th em{font-style:normal;font-size:11.5px;opacity:.88}
.tnew{margin-left:auto;font-size:9.5px;background:rgba(255,255,255,.28);padding:2px 5px;border-radius:3px;letter-spacing:.02em}
.tr{display:flex;gap:7px;align-items:baseline;padding:4.5px 11px;border-top:1px solid var(--paper-2);font-size:11.5px}
.tr:nth-child(even){background:rgba(0,0,0,.018)}
.kk{width:26px;flex:none;font-family:var(--mono);font-size:9px;font-weight:600;color:#fff;
  border-radius:3px;text-align:center;padding:1.5px 0;background:#B6AFA3}
.kk.PK{background:#C08A1E}.kk.FK{background:#2B6CB0}.kk.UK{background:#2E7D6B}.kk.none{background:transparent;color:transparent}
.cn{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--ink)}
.ct{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:#93887A;white-space:nowrap}
.more{padding:5px 11px;font-size:10.5px;color:var(--ink-soft);border-top:1px solid var(--paper-2);background:var(--paper-2)}

/* ---------- sidebar ---------- */
#side{position:fixed;top:56px;right:0;bottom:0;width:410px;max-width:92vw;z-index:25;
  background:#101D28;border-left:1px solid rgba(255,255,255,.1);transform:translateX(102%);
  transition:transform .22s cubic-bezier(.4,0,.2,1);overflow-y:auto;overscroll-behavior:contain}
#side.open{transform:none}
@media (prefers-reduced-motion:reduce){#side{transition:none}}
#sh{position:sticky;top:0;background:#101D28;padding:18px 20px 14px;border-bottom:1px solid rgba(255,255,255,.1);z-index:2}
#sh .dom{font-size:11px;letter-spacing:.02em;margin-bottom:9px;display:inline-block;padding:3px 9px;border-radius:20px}
#sh h2{margin:0;font-size:19px;font-family:var(--mono);font-weight:600;letter-spacing:-.01em}
#sh p{margin:3px 0 0;font-size:14px;color:#9FB4C1}
#close{position:absolute;top:16px;right:16px;width:28px;height:28px;border-radius:6px;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.06);color:#C6D4DD;font-size:15px;cursor:pointer;line-height:1}
#close:hover{background:rgba(255,255,255,.14)}
#sb{padding:18px 20px 60px}
.sec{margin-bottom:22px}
.sec h3{font-size:12px;font-weight:600;color:#7E96A6;margin:0 0 8px}
.sec p{margin:0 0 9px;font-size:13.5px;line-height:1.62;color:#DCE6EC}
.req{font-family:var(--mono);font-size:11.5px;color:#9FB4C1;background:rgba(255,255,255,.06);
  padding:6px 9px;border-radius:5px;display:inline-block}
.note{border-left:3px solid var(--edge-hi);background:rgba(242,200,121,.09);padding:9px 12px;border-radius:0 5px 5px 0;
  margin-bottom:8px;font-size:13px;line-height:1.6;color:#F0E4CC}
.ctab{width:100%;border-collapse:collapse;font-size:12px}
.ctab th{text-align:left;font-weight:500;font-size:10.5px;color:#7E96A6;padding:0 6px 6px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.ctab td{padding:7px 6px 7px 0;border-bottom:1px solid rgba(255,255,255,.055);vertical-align:top;color:#DCE6EC;line-height:1.5}
.ctab td:first-child{font-family:var(--mono);font-size:11px;color:#fff;white-space:nowrap}
.ctab td .ty{display:block;font-family:var(--mono);font-size:9.5px;color:#8298A6;margin-top:2px}
.rel{display:block;width:100%;text-align:left;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
  color:#DCE6EC;border-radius:6px;padding:9px 11px;margin-bottom:6px;cursor:pointer;font-family:var(--sans);font-size:12.5px;line-height:1.5}
.rel:hover{background:rgba(255,255,255,.12)}
.rel b{font-family:var(--mono);font-size:11.5px;color:#fff;font-weight:600}
.rel span{color:#8FA6B4}
#hint{position:fixed;left:18px;bottom:16px;z-index:20;font-size:11.5px;color:#7E96A6;
  background:rgba(14,26,36,.9);border:1px solid rgba(255,255,255,.09);border-radius:6px;padding:7px 12px;line-height:1.7}
#hint b{color:#B6C8D3;font-weight:500}
@media (max-width:640px){
  #legend{display:none}#hint{display:none}#bar h1 span{display:none}
  #side{width:100%;top:56px}
}
</style>
</head>
<body>

<div id="bar">
  <h1>스펙 오디세이 ERD<span>팀 검수판 · 35개 테이블</span></h1>
  <input id="search" type="search" placeholder="테이블·컬럼 검색" aria-label="테이블 검색">
  <div id="zoomer">
    <button class="zb" id="zout" aria-label="축소">−</button>
    <span id="pct">100%</span>
    <button class="zb" id="zin" aria-label="확대">+</button>
    <button class="zb wide" id="zfit">전체보기</button>
  </div>
  <div id="legend"></div>
</div>

<div id="stage">
  <div id="world"><svg id="wires"></svg></div>
</div>

<div id="hint"><b>드래그</b> 화면 이동 · <b>테이블 드래그</b> 위치 변경 · <b>휠</b> 확대·축소 · <b>클릭</b> 상세 보기</div>

<aside id="side" aria-label="테이블 상세">
  <div id="sh">
    <button id="close" aria-label="닫기">×</button>
    <span class="dom" id="sdom"></span>
    <h2 id="sname"></h2>
    <p id="sko"></p>
  </div>
  <div id="sb"></div>
</aside>

<script>
const DOM = {
  user:{ko:'회원·프로필',c:'var(--g-user)'},
  job:{ko:'직무·격차 분석',c:'var(--g-job)'},
  road:{ko:'로드맵·여정',c:'var(--g-road)'},
  mission:{ko:'미션·성장 지표',c:'var(--g-mission)'},
  eval:{ko:'면접관 평가',c:'var(--g-eval)'},
  sys:{ko:'부가·시스템',c:'var(--g-sys)'}
};

/* col: [이름, 타입, 키, 한글설명] */
const T = [
/* ===== 회원 · 프로필 ===== */
{n:'USERS',ko:'회원',g:'user',x:60,y:40,new:0,req:'FR-11 · 12 · 13 · 14 · 21 · 22',
 role:'서비스의 모든 데이터가 매달리는 뿌리 테이블. 로그인 계정 정보와 전공·학년 같은 기본 신상, 그리고 "내가 가고 싶은 직무"를 담는다. 여기 한 줄이 지워지면 그 사람의 여정 전체가 사라진다.',
 notes:['user_type은 지금 전부 \'지원자\'다. 면접관 계정을 나중에 붙일 때 테이블을 갈아엎지 않으려고 미리 뚫어둔 확장 필드(TD-4).','email은 명세서 가입 항목에 없었지만 FR-73 이메일 알림을 살릴 여지를 두려고 추가하기로 했다. 선택 입력.','희망 직무가 없으면 desired_job_id가 NULL이고 desired_job_status가 UNSET이 된다. 이 값으로 "직무 발굴" 화면으로 보낼지 "격차 분석"으로 보낼지 갈린다.'],
 cols:[['id','BIGINT','PK','회원 식별자'],['user_type','VARCHAR(10)','','지원자 / 면접관 — 현재는 전부 지원자'],['login_id','VARCHAR(50)','UK','로그인 아이디'],['password_hash','VARCHAR(255)','','해시+솔트 저장 (NFR-2)'],['email','VARCHAR(100)','','마감 알림 발송용 (선택 입력)'],['major','VARCHAR(50)','','전공'],['grade','VARCHAR(20)','','학년'],['interest_field','VARCHAR(50)','','관심 분야'],['desired_job_id','BIGINT','FK','희망 직무 → JOB (없으면 NULL)'],['desired_job_status','VARCHAR(10)','','SET / UNSET(아직 모르겠음)'],['privacy_consent_at','DATETIME','','민감정보 수집 동의 시점 (NFR-4)'],['last_login_at','DATETIME','','마지막 접속']]},

{n:'USER_SPECS',ko:'보유 스펙',g:'user',x:60,y:430,new:0,req:'FR-23 · 81(면접관 타임라인)',
 role:'자격증·어학·수상을 한 줄씩 쌓는 곳. 한 사람이 여러 개를 가지므로 1:N이다. 취득일이 있어서 면접관 뷰의 시간순 타임라인(FR-81)을 그릴 때 정렬 기준이 된다.',
 notes:['spec_type 하나로 세 종류를 구분한다. 자격증·어학·수상을 각각 테이블로 나누면 컬럼이 거의 같은 테이블이 셋 생기고 조회 쿼리도 셋으로 갈라진다.'],
 cols:[['id','BIGINT','PK','식별자'],['user_id','BIGINT','FK','→ USERS'],['spec_type','VARCHAR(20)','','CERT(자격증) / LANGUAGE(어학) / AWARD(수상)'],['title','VARCHAR(100)','','명칭'],['issuer','VARCHAR(100)','','발급 기관'],['score','VARCHAR(20)','','어학 점수 등'],['acquired_date','DATE','','취득일 — 타임라인 정렬 기준']]},

{n:'USER_PROJECTS',ko:'프로젝트·경험',g:'user',x:60,y:690,new:0,req:'FR-24',
 role:'프로젝트와 경험을 쌓는 곳. 서류 보관함(DOCUMENTS)이 여기에 붙어서 "이 프로젝트의 산출물"로 묶인다.',
 notes:['tech_stack을 둔 이유는 직무 발굴 때문이다. 사용자가 보유 기술을 따로 입력하지 않아도 프로젝트에 쓴 기술에서 역으로 스킬을 뽑아낼 수 있다(FR-38).'],
 cols:[['id','BIGINT','PK','식별자'],['user_id','BIGINT','FK','→ USERS'],['title','VARCHAR(150)','','프로젝트명'],['description','TEXT','','설명'],['tech_stack','VARCHAR(255)','','사용 기술 — 스킬 역산 보조'],['start_date','DATE','','시작일'],['end_date','DATE','','종료일']]},

{n:'USER_SKILLS',ko:'보유 기술 스택',g:'user',x:60,y:950,new:0,req:'FR-25 (필수로 격상)',
 role:'사용자가 입력한 기술을 표준 스킬(SKILL)에 연결해 두는 다리. 이 연결이 있어야 "내 기술 vs 직무 요구 기술"을 DB에서 맞대어 볼 수 있다.',
 notes:['명세서에서는 [권장]이었으나 [필수]로 올리기로 확정했다. 이 테이블이 없으면 임베딩 시맨틱 매칭이라는 차별화 포인트 자체가 성립하지 않는다.','raw_input을 따로 보관하는 게 중요하다. 사용자가 "파이썬으로 데이터 만지기"라고 썼는데 표준 스킬 매칭에 실패해도 원문은 남아야 나중에 재매칭하거나 스킬 마스터를 보강할 수 있다.','similarity_score는 "왜 이 스킬로 인식했는지"를 화면에서 설명할 근거가 된다.'],
 uk:'(user_id, skill_id) — 같은 기술을 두 번 입력해도 한 줄만 남는다',
 cols:[['id','BIGINT','PK','식별자'],['user_id','BIGINT','FK','→ USERS'],['skill_id','BIGINT','FK','→ SKILL (매칭 실패 시 NULL)'],['raw_input','VARCHAR(100)','','사용자 입력 원문 — 항상 보존'],['similarity_score','DECIMAL(5,4)','','원문↔표준 스킬 매칭 신뢰도'],['proficiency','VARCHAR(20)','','숙련도 (선택)']]},

{n:'SURVEY_QUESTION',ko:'설문 문항',g:'user',x:60,y:1230,new:1,req:'FR-38 · TD-5(d)',
 role:'직무 발굴용 흥미·성향 문항과 초기 자가진단 문항을 함께 담는 문항 은행.',
 notes:['직무 발굴 설문과 자가진단을 한 테이블에 survey_type으로 구분하기로 확정했다. 문항 구조가 같은데 테이블을 나누면 응답 저장·조회 로직이 통째로 중복된다.','job_category_hint는 발굴 문항에서만, score_weight는 자가진단 문항에서만 쓴다. 서로 쓰지 않는 쪽은 NULL로 둔다.'],
 cols:[['id','BIGINT','PK','식별자'],['survey_type','VARCHAR(20)','','JOB_DISCOVERY(직무 발굴) / SELF_CHECK(자가진단)'],['content','VARCHAR(255)','','문항 내용'],['job_category_hint','VARCHAR(50)','','이 응답이 가리키는 직무 계열'],['score_weight','INT','','자가진단 초기 등급 배점']]},

{n:'USER_SURVEY_ANSWER',ko:'설문 응답',g:'user',x:60,y:1470,new:1,req:'FR-38',
 role:'사용자가 문항에 답한 값. 직무 발굴에서는 후보 직무 추론 재료로, 자가진단에서는 첫 등급 산정 재료로 쓰인다.',
 notes:['자가진단은 초기 1회만 인정한다(TD-5). answered_at으로 최초 응답인지 판별한다.'],
 uk:'(user_id, question_id) — 재응답은 새 줄이 아니라 기존 값 갱신',
 cols:[['id','BIGINT','PK','식별자'],['user_id','BIGINT','FK','→ USERS'],['question_id','BIGINT','FK','→ SURVEY_QUESTION'],['answer_value','INT','','점수형 응답 (1~5)'],['answered_at','DATETIME','','응답 시각']]},

/* ===== 마스터 · 직무 ===== */
{n:'SKILL',ko:'기술 마스터',g:'job',x:420,y:40,new:1,req:'TD-1 임베딩 시맨틱 매칭',
 role:'서비스가 아는 모든 기술의 표준 이름과 의미 벡터를 보관하는 사전. 사용자 스킬과 직무 요구 기술이 전부 여기를 거쳐 서로 연결된다. 이 서비스의 시맨틱 매칭이 작동하는 심장부.',

 cols:[['id','BIGINT','PK','식별자'],['skill_name','VARCHAR(100)','UK','표준 명칭 (예: Pandas)'],['category','VARCHAR(50)','','언어 / 프레임워크 / 도구 / 소프트스킬'],['embedding_vector','TEXT','','의미 벡터 768차원 (JSON 배열)'],['embedding_model','VARCHAR(50)','','생성 모델명 — 모델 교체 시 재계산 대상 식별'],['embedded_at','DATETIME','','벡터 생성 시각']]},

{n:'JOB',ko:'직무 마스터',g:'job',x:420,y:350,new:1,req:'TD-2 On-demand 수집',

 notes:['IT 계열로 한정하기로 확정했다. 초기 대상이 15~20개로 줄어 명세서 TD-2의 "수기 구축 5~10개"보다 넓은 커버리지를 확보할 수 있고, 스킬 마스터도 IT 기술로만 채워져 임베딩 품질이 올라간다.','is_popular가 true면 미리 수집해 둔다(조회가 빠름). false면 사용자가 요청할 때 워크넷을 호출하고 결과를 캐싱해 다음 사용자부터 빨라진다.','재수집은 워크넷 배치 주 1회(일요일 새벽), On-demand 캐시는 TTL 7일로 추천.'],
 cols:[['id','BIGINT','PK','식별자'],['job_name','VARCHAR(100)','UK','정규화된 직무명'],['job_category','VARCHAR(50)','','BACKEND / FRONTEND / DATA / DEVOPS / SECURITY / PM'],['is_popular','BOOLEAN','','사전 수집 대상 여부'],['last_collected_at','DATETIME','','마지막 수집 시각 — 재수집 판단 기준']]},

{n:'JOB_REQUIRED_SKILL',ko:'직무 요구 기술',g:'job',x:420,y:620,new:1,req:'TD-1 규칙기반 격차 분석',

 notes:['초안에서는 이게 JSON 한 덩어리였다. 그러면 TD-1이 정의한 "규칙기반 DB 대조"를 SQL로 할 수 없고 인사이트 집계도 막힌다. 그래서 행 단위로 풀었다.','is_estimated를 직무가 아니라 행에 둔 게 핵심이다. 한 직무 안에서도 워크넷 실측 기술과 대기업 보완용 LLM 추정 기술이 섞이므로, 직무 단위 플래그로는 어느 항목이 추정인지 구분할 수 없다.','대기업 요구스펙은 명세서 대안 B 확정 — LLM이 "해당 직무 대기업의 일반적 요구 역량"을 생성하고 화면에 "예시적 추정"으로 명시한다.'],

{n:'JOB_BENCHMARK_SPEC',ko:'합격 기준 스펙',g:'job',x:420,y:930,new:1,req:'FR-46',
 role:'직무별 "이 정도면 붙는다"는 기준 스펙. 로드맵의 최종 목적지 역할을 한다.',
 notes:['실제 합격자 데이터는 확보 경로가 없다. 그래서 LLM이 IT 직무별 최고 수준 기준을 생성해 채우기로 확정했다. 최소 합격선이 아니라 최고 합격률 기준이라, 사실상 끝이 없는 목적지다.','is_estimated는 항상 true다. 추정치임을 화면에 반드시 노출해야 한다(TD-2 대안 C, 투명성).','tier가 ROADMAP_STEP의 tier와 이어진다. ENTRY부터 EXPERT까지 단계가 연장되는 구조의 종착점.','LLM 호출할 때마다 값이 흔들리면 사용자가 혼란스러우므로 자동 재생성은 하지 않고 수동 트리거로만 갱신한다.'],
 cols:[['id','BIGINT','PK','식별자'],['job_id','BIGINT','FK','→ JOB'],['tier','VARCHAR(20)','','ENTRY / CORE / ADVANCED / EXPERT'],['spec_type','VARCHAR(20)','','CERT / PROJECT / SKILL / LANGUAGE'],['content','VARCHAR(255)','','예: "정보처리기사", "실서비스 배포 경험"'],['is_estimated','BOOLEAN','','항상 true — 추정치'],['generated_at','DATETIME','','수동 재생성 시점']]},

{n:'CERTIFICATION',ko:'자격증 마스터',g:'job',x:420,y:1240,new:1,req:'FR-71 자동화',

{n:'GAP_ANALYSIS',ko:'격차 분석',g:'road',x:790,y:40,new:0,req:'FR-31 · 37 · 42',

{n:'ROADMAP',ko:'로드맵 (길)',g:'road',x:790,y:540,new:0,req:'FR-32 · 36 · 37',

{n:'ROADMAP_STEP',ko:'로드맵 단계',g:'road',x:790,y:850,new:0,req:'FR-32 · 33 · 36 · 43(여정 지도)',

 notes:['cert_schedule_id가 있으면 자격증 마스터에서 일정을 끌어와 자동 생성된다. 없으면 사용자가 직접 입력한 커스텀 일정이다.','is_notified는 이메일 발송 여부(FR-73, [선택]). USERS.email이 있어야 동작한다.'],
 uk:'(user_id, cert_schedule_id) — 같은 시험 일정 D-day 중복 등록 방지',
 cols:[['id','BIGINT','PK','식별자'],['user_id','BIGINT','FK','→ USERS'],['cert_schedule_id','BIGINT','FK','→ CERT_SCHEDULE (자동 생성 시)'],['title','VARCHAR(100)','','일정명'],['target_date','DATE','','목표일'],['alert_type','VARCHAR(20)','','CERT / RECRUIT / CUSTOM'],['is_notified','BOOLEAN','','이메일 발송 여부']]},

{n:'EXTERNAL_API_CACHE',ko:'외부 API 캐시',g:'sys',x:1530,y:1410,new:1,req:'FR-111 · 112 · NFR-1',
 role:'워크넷·LLM·임베딩 호출 결과를 저장해 두는 곳. API가 죽었을 때 대신 보여줄 마지막 보루.',
 notes:['FR-111·112는 "실패 시 직전 캐싱 결과로 대체 표시"를 요구한다. 직전 결과를 어딘가 저장해두지 않으면 이 요구사항은 성립하지 않는데, 초안에는 그 저장소가 없었다.','중복 호출 최소화(NFR-1)도 같은 테이블이 담당한다. request_key로 이미 받아온 결과가 있는지 먼저 확인한다.','status가 FAILED면 화면에 "일시적으로 불러올 수 없음"을 안내한다(FR-112).'],

{n:'AI_USAGE_LOG',ko:'AI 활용 기록',g:'sys',x:1900,y:1120,new:0,req:'FR-101 · 102',
 role:'사용자가 직접 제출한 AI 사용 기록. AI 리터러시를 강점으로 보여주는 리포트 재료.',
 notes:['[선택] 항목이다. 여유 있을 때 붙인다.','민감 데이터이므로 공유 여부는 본인이 정한다(NFR-4). 긍정적 강점으로만 표현한다.'],
 cols:[['id','BIGINT','PK','식별자'],['user_id','BIGINT','FK','→ USERS'],['usage_record_json','TEXT','','사용자 제출 기록'],['is_shared','BOOLEAN','','공유 여부 — 본인 선택']]}
];

const R = [
 ['USERS','USER_SPECS','1:N','보유'],['USERS','USER_PROJECTS','1:N','보유'],['USERS','USER_SKILLS','1:N','보유'],
 ['USERS','USER_SURVEY_ANSWER','1:N','응답'],['USERS','GAP_ANALYSIS','1:N','직무별 진단'],['USERS','JOB_RECOMMENDATION','1:N','수신'],
 ['USERS','JOB','N:1','희망직무'],['SKILL','USER_SKILLS','1:N','표준화'],['SKILL','JOB_REQUIRED_SKILL','1:N','참조'],
 ['SKILL','GAP_ANALYSIS_ITEM','1:N','참조'],['JOB','JOB_REQUIRED_SKILL','1:N','요구'],['JOB','JOB_BENCHMARK_SPEC','1:N','합격 기준'],
 ['JOB','JOB_RECOMMENDATION','1:N','후보'],['JOB','GAP_ANALYSIS','1:N','목표'],['GAP_ANALYSIS','GAP_ANALYSIS_ITEM','1:N','상세 항목'],
 ['GAP_ANALYSIS','ROADMAP','1:1','길 생성'],['ROADMAP','ROADMAP_STEP','1:N','단계'],['CERTIFICATION','ROADMAP_STEP','1:N','자격증 단계'],
 ['SURVEY_QUESTION','USER_SURVEY_ANSWER','1:N','문항'],['CERTIFICATION','CERT_SCHEDULE','1:N','시험 일정'],
 ['CERT_SCHEDULE','DDAY_ALERT','1:N','D-day 자동생성'],['USERS','USER_DAILY_MISSION','1:N','배정'],['PROBLEM','USER_DAILY_MISSION','1:N','출제'],
 ['USERS','SCORE_LOG','1:N','적립'],['USERS','USER_SCORE_SUMMARY','1:1','집계'],['LEVEL_TIER','USER_SCORE_SUMMARY','1:N','등급 기준'],
 ['USERS','SPEC_SCORE_HISTORY','1:N','성장 기록'],['JOB','JOB_SKILL_TREND','1:N','시계열'],['SKILL','JOB_SKILL_TREND','1:N','기술'],
 ['TREND_TECH','TREND_TECH_JOB','1:N','연관'],['JOB','TREND_TECH_JOB','1:N','연관'],['USERS','SHARE_LINK','1:N','발급'],
 ['SHARE_LINK','SHARE_LINK_VIEW_LOG','1:N','열람'],['EVALUATION_SESSION','EVALUATION_SESSION_ITEM','1:N','비교 대상'],
 ['SHARE_LINK','EVALUATION_SESSION_ITEM','1:N','포함'],['EVALUATION_SESSION','EVALUATION_CRITERIA','1:N','채점 기준'],
 ['USERS','DOCUMENTS','1:N','업로드'],['USER_PROJECTS','DOCUMENTS','1:N','연결'],['USERS','DDAY_ALERT','1:N','등록'],
 ['USERS','AI_USAGE_LOG','1:N','제출'],['SKILL','EVALUATION_CRITERIA','1:N','요구 역량'],
 ['USERS','ROADMAP','1:N','소유'],['SKILL','ROADMAP_STEP','1:N','목표 역량']
];

const byName = {}; T.forEach(t=>byName[t.n]=t);
const world=document.getElementById('world'), svg=document.getElementById('wires'), stage=document.getElementById('stage');
const NS='http://www.w3.org/2000/svg';
const MAXROWS=8;
let sel=null, topZ=1, activeGroups=new Set(Object.keys(DOM));

/* ---- build legend ---- */
const legend=document.getElementById('legend');
Object.entries(DOM).forEach(([k,v])=>{
  const b=document.createElement('button');
  b.className='lg'; b.setAttribute('aria-pressed','true'); b.dataset.g=k;
  b.style.color=v.c;
  b.innerHTML='<i style="background:'+v.c+'"></i>'+v.ko;
  b.onclick=()=>{
    if(activeGroups.has(k)&&activeGroups.size===Object.keys(DOM).length){activeGroups=new Set([k]);}
    else if(activeGroups.has(k)){activeGroups.delete(k); if(!activeGroups.size)activeGroups=new Set(Object.keys(DOM));}
    else activeGroups.add(k);
    legend.querySelectorAll('.lg').forEach(x=>x.setAttribute('aria-pressed',activeGroups.has(x.dataset.g)?'true':'false'));
    document.getElementById('search').value=''; applyFilter();
  };
  legend.appendChild(b);
});

/* ---- build tables ---- */
T.forEach(t=>{
  const d=document.createElement('div');
  d.className='tb'; d.dataset.n=t.n; d.style.left=t.x+'px'; d.style.top=t.y+'px';
  let h='<div class="th" style="background:'+DOM[t.g].c+'"><b>'+t.n+'</b><em>'+t.ko+'</em>'+(t.new?'<span class="tnew">신설</span>':'')+'</div>';
  t.cols.slice(0,MAXROWS).forEach(c=>{
    h+='<div class="tr"><span class="kk '+(c[2]||'none')+'">'+(c[2]||'·')+'</span>'+
       '<span class="cn">'+c[0]+'</span><span class="ct">'+c[1]+'</span></div>';
  });
  if(t.cols.length>MAXROWS) h+='<div class="more">그 외 '+(t.cols.length-MAXROWS)+'개 컬럼 — 클릭해서 전체 보기</div>';
  d.innerHTML=h;
  world.appendChild(d); t.el=d;
});

/* ---- wires ---- */
R.forEach(r=>{
  const p=document.createElementNS(NS,'path'); p.setAttribute('class','wire');
  const tx=document.createElementNS(NS,'text'); tx.setAttribute('class','wcap'); tx.textContent=r[2];
  svg.appendChild(p); svg.appendChild(tx); r.p=p; r.t=tx;
});

function box(n){const t=byName[n];return{x:parseFloat(t.el.style.left),y:parseFloat(t.el.style.top),w:t.el.offsetWidth,h:t.el.offsetHeight};}
function drawWires(){
  R.forEach(r=>{
    const a=box(r[0]),b=box(r[1]);
    const ac={x:a.x+a.w/2,y:a.y+a.h/2}, bc={x:b.x+b.w/2,y:b.y+b.h/2};
    let x1,y1,x2,y2;
    if(Math.abs(bc.x-ac.x)>Math.abs(bc.y-ac.y)){
      x1=bc.x>ac.x?a.x+a.w:a.x; y1=Math.min(Math.max(bc.y,a.y+14),a.y+a.h-14);
      x2=bc.x>ac.x?b.x:b.x+b.w; y2=Math.min(Math.max(ac.y,b.y+14),b.y+b.h-14);
      const m=(x1+x2)/2;
      r.p.setAttribute('d','M'+x1+','+y1+'C'+m+','+y1+' '+m+','+y2+' '+x2+','+y2);
    }else{
      y1=bc.y>ac.y?a.y+a.h:a.y; x1=Math.min(Math.max(bc.x,a.x+18),a.x+a.w-18);
      y2=bc.y>ac.y?b.y:b.y+b.h; x2=Math.min(Math.max(ac.x,b.x+18),b.x+b.w-18);
      const m=(y1+y2)/2;
      r.p.setAttribute('d','M'+x1+','+y1+'C'+x1+','+m+' '+x2+','+m+' '+x2+','+y2);
    }
    r.t.setAttribute('x',(x1+x2)/2); r.t.setAttribute('y',(y1+y2)/2-4);
  });
}

/* ---- pan & zoom ---- */
let sc=1,ox=0,oy=0;
function apply(){world.style.transform='translate('+ox+'px,'+oy+'px) scale('+sc+')';document.getElementById('pct').textContent=Math.round(sc*100)+'%';}
function zoomAt(cx,cy,f){
  const ns=Math.min(2.2,Math.max(.18,sc*f));
  ox=cx-(cx-ox)*(ns/sc); oy=cy-(cy-oy)*(ns/sc); sc=ns; apply();
}
stage.addEventListener('wheel',e=>{e.preventDefault();const r=stage.getBoundingClientRect();
  zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.12:1/1.12);},{passive:false});
document.getElementById('zin').onclick=()=>zoomAt(stage.clientWidth/2,stage.clientHeight/2,1.2);
document.getElementById('zout').onclick=()=>zoomAt(stage.clientWidth/2,stage.clientHeight/2,1/1.2);
document.getElementById('zfit').onclick=fit;
function fit(){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  T.forEach(t=>{const b=box(t.n);x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h);});
  const pad=60, reserve=(side.classList.contains('open')&&window.innerWidth>900)?430:20;
  const sw=stage.clientWidth-reserve, sh=stage.clientHeight;
  sc=Math.min((sw-pad*2)/(x1-x0),(sh-pad*2)/(y1-y0),1.1);
  ox=pad-x0*sc+(sw-(x1-x0)*sc-pad*2)/2; oy=pad-y0*sc; apply();
}

let panning=false,sx,sy;
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('.tb'))return;
  panning=true;sx=e.clientX-ox;sy=e.clientY-oy;stage.classList.add('drag');stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove',e=>{if(!panning)return;ox=e.clientX-sx;oy=e.clientY-sy;apply();});
stage.addEventListener('pointerup',e=>{panning=false;stage.classList.remove('drag');});
stage.addEventListener('pointercancel',()=>{panning=false;stage.classList.remove('drag');});

/* ---- table drag + select ---- */
T.forEach(t=>{
  let dr=false,dx,dy,moved=false;
  t.el.addEventListener('pointerdown',e=>{
    dr=true;moved=false;
    dx=e.clientX/sc-parseFloat(t.el.style.left); dy=e.clientY/sc-parseFloat(t.el.style.top);
    t.el.setPointerCapture(e.pointerId); t.el.style.cursor='grabbing';
    t.el.style.zIndex=(++topZ); e.stopPropagation();
  });
  t.el.addEventListener('pointermove',e=>{
    if(!dr)return; moved=true;
    t.el.style.left=(e.clientX/sc-dx)+'px'; t.el.style.top=(e.clientY/sc-dy)+'px'; drawWires();
  });
  t.el.addEventListener('pointerup',e=>{
    dr=false;t.el.style.cursor='grab';
    if(!moved) select(t.n);
  });
});

/* ---- sidebar ---- */
const side=document.getElementById('side');
function select(n){
  sel=n; const t=byName[n];
  document.getElementById('sdom').textContent=DOM[t.g].ko;
  document.getElementById('sdom').style.cssText='background:'+DOM[t.g].c+';color:#fff';
  document.getElementById('sname').textContent=t.n;
  document.getElementById('sko').textContent=t.ko+(t.new?' · 이번에 신설한 테이블':'');
  let h='<div class="sec"><h3>이 테이블이 하는 일</h3><p>'+t.role+'</p>'+
        '<span class="req">관련 요구사항 · '+t.req+'</span></div>';
  if(t.notes&&t.notes.length){
    h+='<div class="sec"><h3>설계 판단과 논의 결과</h3>';
    t.notes.forEach(x=>h+='<div class="note">'+x+'</div>'); h+='</div>';
  }
  if(t.uk){h+='<div class="sec"><h3>복합 UNIQUE 제약</h3><div class="note">'+t.uk+'</div></div>';}
  h+='<div class="sec"><h3>컬럼 '+t.cols.length+'개</h3><table class="ctab"><thead><tr><th>컬럼</th><th>키</th><th>설명</th></tr></thead><tbody>';
  t.cols.forEach(c=>{h+='<tr><td>'+c[0]+'<span class="ty">'+c[1]+'</span></td><td><span class="kk '+(c[2]||'none')+'">'+(c[2]||'·')+'</span></td><td>'+(c[3]||'—')+'</td></tr>';});
  h+='</tbody></table></div>';
  const rels=R.filter(r=>r[0]===n||r[1]===n);
  if(rels.length){
    h+='<div class="sec"><h3>연결된 테이블 '+rels.length+'개</h3>';
    rels.forEach(r=>{
      const other=r[0]===n?r[1]:r[0], dir=r[0]===n?'→':'←';
      h+='<button class="rel" data-go="'+other+'"><b>'+dir+' '+other+'</b> <span>('+byName[other].ko+')</span><br><span>'+r[2]+' · '+r[3]+'</span></button>';
    });
    h+='</div>';
  }
  h+='<div class="sec"><h3>공통 컬럼</h3><p>모든 테이블에 created_at(생성 시각), updated_at(수정 시각), is_deleted(논리 삭제)가 공통으로 들어갑니다. 위 목록에서는 반복을 피해 생략했습니다.</p></div>';
  document.getElementById('sb').innerHTML=h;
  document.getElementById('sb').scrollTop=0; side.scrollTop=0;
  document.getElementById('sb').querySelectorAll('.rel').forEach(b=>b.onclick=()=>{select(b.dataset.go);focusOn(b.dataset.go);});
  side.classList.add('open'); highlight();
}
function focusOn(n){
  const b=box(n), sw=stage.clientWidth-(window.innerWidth>900?430:0);
  ox=sw/2-(b.x+b.w/2)*sc; oy=stage.clientHeight/2-(b.y+b.h/2)*sc; apply();
}
function highlight(){
  const near=new Set([sel]);
  R.forEach(r=>{if(r[0]===sel)near.add(r[1]);if(r[1]===sel)near.add(r[0]);});
  T.forEach(t=>{
    t.el.classList.toggle('sel',t.n===sel);
    t.el.classList.toggle('dim',sel?!near.has(t.n):false);
  });
  R.forEach(r=>{
    const on=sel&&(r[0]===sel||r[1]===sel);
    r.p.classList.toggle('on',!!on); r.t.classList.toggle('on',!!on);
    r.p.style.opacity=sel?(on?1:.12):''; r.t.style.opacity=sel?(on?1:.08):'';
  });
}
document.getElementById('close').onclick=()=>{side.classList.remove('open');sel=null;highlight();applyFilter();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){side.classList.remove('open');sel=null;highlight();applyFilter();}});

/* ---- search / group filter ---- */
const search=document.getElementById('search');
search.addEventListener('input',applyFilter);
function applyFilter(){
  const q=search.value.trim().toLowerCase();
  if(sel){sel=null;side.classList.remove('open');
    T.forEach(t=>t.el.classList.remove('sel'));
    R.forEach(r=>{r.p.classList.remove('on');r.t.classList.remove('on');});}
  T.forEach(t=>{
    const inGroup=activeGroups.has(t.g);
    const hit=!q||t.n.toLowerCase().includes(q)||t.ko.includes(q)||
      t.cols.some(c=>c[0].toLowerCase().includes(q)||(c[3]||'').includes(q));
    t.el.classList.toggle('dim',!(inGroup&&hit));
  });
  R.forEach(r=>{
    const vis=!byName[r[0]].el.classList.contains('dim')&&!byName[r[1]].el.classList.contains('dim');
    r.p.style.opacity=vis?'':'.08'; r.t.style.opacity=vis?'':'.06';
  });
}

drawWires(); fit();
window.addEventListener('resize',()=>{drawWires();});
</script>
