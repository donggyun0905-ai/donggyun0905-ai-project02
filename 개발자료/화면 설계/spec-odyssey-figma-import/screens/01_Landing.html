<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>1. 홈 (비로그인)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
body { margin: 0; font-family: 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif; }
  a { color: #1f7a6c; text-decoration: none; }
  a:hover { text-decoration: underline; }
html { margin: 0; }
</style>
</head>
<body>
<div style="width: 1440px; height: 760px; box-sizing: border-box; background: #f6efe1; color: #2b2118; display: flex; flex-direction: column;">

  <!-- 헤더 (비로그인 — nav 없음) -->
  <div style="background: #14303d; padding: 18px 40px; border-bottom: 3px solid #c9a24b; display: flex; align-items: center; justify-content: space-between;">
    <div style="font-family: Georgia, 'Noto Serif KR', serif; font-size: 20px; font-weight: 700; color: #fff;">🧭 스펙 오디세이</div>
  </div>

  <!-- 본문 -->
  <div style="max-width: 820px; margin: 0 auto; width: 100%; padding: 56px 24px; flex-grow: 1;">
    <div style="font-family: Georgia, 'Noto Serif KR', serif; font-size: 32px; font-weight: 700; color: #14303d; border-bottom: 3px solid #c9a24b; padding-bottom: 8px; display: inline-block;">스펙 오디세이</div>
    <div style="font-size: 15px; color: #5a4a38; margin-top: 14px;">취업 준비의 부족한 부분을 진단하고, 목표 직무까지 가는 순서 있는 여정을 제시합니다.</div>

    <div style="background: #fffaf0; border: 1px solid #ddc9a3; border-radius: 10px; box-shadow: 0 2px 8px rgba(43,33,24,0.12); padding: 28px 32px; margin-top: 28px; max-width: 420px;">
      <div style="display: flex; gap: 12px;">
        <div style="background: #a9822f; color: #fff; border-radius: 6px; padding: 10px 26px; font-size: 15px; font-weight: 600;">로그인</div>
        <div style="background: #a9822f; color: #fff; border-radius: 6px; padding: 10px 26px; font-size: 15px; font-weight: 600;">회원가입</div>
      </div>
      <div style="font-size: 13px; color: #5a4a38; margin-top: 14px;">로그인하면 내 프로필과 로드맵을 볼 수 있습니다.</div>
    </div>
  </div>

  <!-- 푸터 -->
  <div style="text-align: center; padding: 18px; color: #5a4a38; font-size: 13px; border-top: 1px solid #ddc9a3;">⚓ 스펙 오디세이 — 당신의 취업 항해를 돕습니다</div>
</div>
</body>
</html>
