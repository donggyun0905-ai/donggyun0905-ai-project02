<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>6. 오류 화면</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
body { margin: 0; font-family: 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif; }
html { margin: 0; }
</style>
</head>
<body>
<div style="width: 1440px; height: 700px; box-sizing: border-box; background: #f6efe1; color: #2b2118; display: flex; flex-direction: column;">

  <div style="background: #14303d; padding: 18px 40px; border-bottom: 3px solid #c9a24b;">
    <div style="font-family: Georgia, 'Noto Serif KR', serif; font-size: 20px; font-weight: 700; color: #fff;">🧭 스펙 오디세이</div>
  </div>

  <div style="max-width: 820px; margin: 0 auto; width: 100%; padding: 56px 24px; flex-grow: 1;">
    <div style="font-family: Georgia, 'Noto Serif KR', serif; font-size: 28px; font-weight: 700; color: #14303d;">⚓ 항해 중 문제가 생겼습니다</div>
    <div style="background: #fffaf0; border: 1px solid #ddc9a3; border-radius: 10px; box-shadow: 0 2px 8px rgba(43,33,24,0.12); padding: 24px 28px; margin-top: 20px; max-width: 480px;">
      <div style="font-size: 14px;">요청을 처리하는 중 문제가 생겼습니다. 잠시 후 다시 시도해주세요.</div>
      <div style="margin-top: 14px; background: #a9822f; color: #fff; border-radius: 6px; padding: 9px 22px; font-size: 14px; font-weight: 600; display: inline-block;">처음으로</div>
    </div>
  </div>

  <div style="text-align: center; padding: 18px; color: #5a4a38; font-size: 13px; border-top: 1px solid #ddc9a3;">⚓ 스펙 오디세이 — 당신의 취업 항해를 돕습니다</div>
</div>
</body>
</html>
