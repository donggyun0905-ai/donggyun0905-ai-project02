<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스펙 오디세이 코드 해설서</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 왼쪽 탐색 열 + 오른쪽 읽기 영역. 휴대폰에서는 위아래로 쌓인다. */
:root {
  --bg: #F4F6F4; --surface: #FFFFFF; --surface-2: #EDF1EF; --ink: #142A2C; --ink-soft: #2E4648;
  --muted: #5C7375; --line: #D2DEDB; --accent: #0B6E6E; --accent-soft: #E0EFEE;
  --gold: #8A6A14; --gold-soft: #F3EDDC; --warn: #96551B; --warn-soft: #F7E9DC;
  --code-bg: #F8FAF9; --k: #7A3E9D; --s: #2F6D4F; --c: #7B8A8B; --n: #96551B; --t: #0B6E6E; --f: #1F4E79;
  --display: "Gowun Batang", "Nanum Myeongjo", Georgia, serif;
  --body: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --mono: "IBM Plex Mono", Consolas, "D2Coding", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1818; --surface: #162324; --surface-2: #1D2D2E; --ink: #E6EEEC; --ink-soft: #C3D3D1;
  --muted: #90A5A4; --line: #2C4142; --accent: #5FC2BC; --accent-soft: #1A3230; --gold: #D9B45A; --gold-soft: #2B2616;
  --warn: #D59A5E; --warn-soft: #2E2116; --code-bg: #121E1F; --k: #C9A0E8; --s: #8FD1A8; --c: #7F9596; --n: #E3B07C; --t: #6FD3CC; --f: #8DB8E8;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1818; --surface: #162324; --surface-2: #1D2D2E; --ink: #E6EEEC; --ink-soft: #C3D3D1;
  --muted: #90A5A4; --line: #2C4142; --accent: #5FC2BC; --accent-soft: #1A3230; --gold: #D9B45A; --gold-soft: #2B2616;
  --warn: #D59A5E; --warn-soft: #2E2116; --code-bg: #121E1F; --k: #C9A0E8; --s: #8FD1A8; --c: #7F9596; --n: #E3B07C; --t: #6FD3CC; --f: #8DB8E8;
  color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.65; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, .mono { font-family: var(--mono); font-size: 0.88em; }
:not(pre) > code { background: var(--surface-2); padding: 1px 5px; border-radius: 3px; }

.app { display: grid; grid-template-columns: 320px minmax(0, 1fr); height: 100%; }
.side { min-width: 0; border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.brand { padding: 16px 16px 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.brand b { font-family: var(--display); font-size: 1.3rem; line-height: 1.3; }
.brand span { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); letter-spacing: 0.04em; }
.tabs { min-width: 0; display: flex; flex-wrap: wrap; gap: 4px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.tab { border: 1px solid var(--line); background: transparent; padding: 3px 10px; border-radius: 999px; cursor: pointer; font-size: 0.82rem; color: var(--ink-soft); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.search { padding: 10px 12px; border-bottom: 1px solid var(--line); }
.search input { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; font-size: 0.88rem; }
.nav { overflow-y: auto; flex: 1; padding: 6px 0 24px; min-height: 0; }
.nav h4 { margin: 12px 14px 4px; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-family: var(--mono); font-weight: 500; display: flex; justify-content: space-between; }
.nav button.item { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 4px 14px 4px 18px; cursor: pointer; font-size: 0.84rem; color: var(--ink-soft); line-height: 1.4; }
.nav button.item:hover { background: var(--surface-2); }
.nav button.item[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
.nav button.item small { display: block; color: var(--muted); font-size: 0.74rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav details > summary { cursor: pointer; list-style: none; }
.nav details > summary::-webkit-details-marker { display: none; }
.nav details > summary h4::before { content: "▸ "; }
.nav details[open] > summary h4::before { content: "▾ "; }

.main { overflow-y: auto; min-width: 0; }
.page { max-width: 1060px; margin: 0 auto; padding-inline: 28px; padding-block: 28px 80px; }
.page h1 { font-family: var(--display); font-size: 2rem; line-height: 1.3; margin: 0 0 6px; text-wrap: balance; }
.page h2 { font-family: var(--display); font-size: 1.45rem; line-height: 1.35; margin: 40px 0 10px; padding-top: 14px; border-top: 2px solid var(--ink); text-wrap: balance; }
.page h3 { font-size: 1.05rem; margin: 22px 0 6px; }
.page p, .page li { max-width: 74ch; }
.lede { color: var(--ink-soft); font-size: 1.05rem; }
.eyebrow { font-family: var(--mono); font-size: 0.74rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); margin: 18px 0; }
.stat { background: var(--surface); padding: 10px 14px; }
.stat b { display: block; font-family: var(--mono); font-size: 1.35rem; color: var(--gold); font-variant-numeric: tabular-nums; font-weight: 500; }
.stat span { font-size: 0.8rem; color: var(--muted); }
.callout { border-left: 4px solid var(--gold); background: var(--gold-soft); padding: 12px 16px; margin: 14px 0; border-radius: 0 6px 6px 0; }
.callout.warn { border-color: var(--warn); background: var(--warn-soft); }
.callout.info { border-color: var(--accent); background: var(--accent-soft); }
.callout > b:first-child { display: block; margin-bottom: 4px; }
.tscroll { overflow-x: auto; border: 1px solid var(--line); background: var(--surface); margin: 12px 0; border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
thead th { background: var(--surface-2); font-weight: 600; white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 14px 0; }
.flow span.box { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 6px; font-size: 0.86rem; }
.flow span.box.hot { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.flow span.arr { color: var(--muted); }
a.f, button.f { font-family: var(--mono); font-size: 0.84em; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
.formula { font-family: var(--mono); background: var(--surface); border: 1px solid var(--line); padding: 10px 14px; border-radius: 6px; overflow-x: auto; white-space: pre; font-size: 0.85rem; }
ol.steps { padding-left: 1.3em; }
ol.steps li { margin: 6px 0; }

/* 파일 상세 */
.crumbs { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); word-break: break-all; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.chip { font-family: var(--mono); font-size: 0.72rem; padding: 2px 8px; border-radius: 3px; border: 1px solid var(--line); color: var(--ink-soft); background: var(--surface); }
.chip.acc { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.chip.gold { border-color: var(--gold); color: var(--gold); background: var(--gold-soft); }
.doc { white-space: pre-wrap; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); padding: 12px 16px; border-radius: 0 6px 6px 0; font-size: 0.9rem; max-width: 100%; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin: 12px 0; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; min-width: 0; }
.box h5 { margin: 0 0 6px; font-size: 0.78rem; color: var(--muted); letter-spacing: 0.04em; font-weight: 600; }
.box ul { margin: 0; padding-left: 1.1em; }
.box li { font-size: 0.84rem; line-height: 1.5; overflow-wrap: anywhere; }
.methods { list-style: none; padding: 0; margin: 0; }
.methods li { padding: 6px 0; border-bottom: 1px dashed var(--line); }
.methods li:last-child { border-bottom: 0; }
.methods code { font-size: 0.8rem; overflow-wrap: anywhere; }
.methods .note { display: block; color: var(--muted); font-size: 0.82rem; }
.src { display: grid; grid-template-columns: auto minmax(0, 1fr); border: 1px solid var(--line); border-radius: 6px; background: var(--code-bg); overflow: hidden; margin-top: 10px; }
.src pre { margin: 0; padding: 10px 12px; font-family: var(--mono); font-size: 12.5px; line-height: 19px; }
.src .gut { color: var(--muted); text-align: right; user-select: none; border-right: 1px solid var(--line); background: var(--surface-2); padding-right: 10px; }
.src .code { overflow-x: auto; }
.src .code code { background: none; padding: 0; font-size: inherit; }
.src .hl { background: var(--gold-soft); display: inline-block; width: 100%; }
.srcbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-top: 22px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 0.82rem; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.hljs-keyword, .hljs-built_in, .hljs-meta-keyword, .hljs-selector-tag, .hljs-literal { color: var(--k); }
.hljs-string, .hljs-attr-value, .hljs-regexp { color: var(--s); }
.hljs-comment, .hljs-quote { color: var(--c); font-style: italic; }
.hljs-number { color: var(--n); }
.hljs-type, .hljs-class .hljs-title, .hljs-title.class_, .hljs-name, .hljs-tag { color: var(--t); }
.hljs-title.function_, .hljs-function .hljs-title, .hljs-attr, .hljs-attribute { color: var(--f); }
.hljs-meta, .hljs-variable, .hljs-template-variable { color: var(--gold); }
.md h1 { font-size: 1.6rem; } .md h2 { font-size: 1.25rem; } .md h3 { font-size: 1.05rem; }
.md pre { background: var(--code-bg); border: 1px solid var(--line); padding: 10px 12px; border-radius: 6px; overflow-x: auto; font-size: 0.82rem; }
.md table { display: block; overflow-x: auto; }
.md img { display: none; }
.empty { color: var(--muted); font-style: italic; }
.list-card { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.list-card button { text-align: left; background: var(--surface); border: 0; padding: 10px 14px; cursor: pointer; display: grid; gap: 2px; }
.list-card button:hover { background: var(--surface-2); }
.list-card b { font-size: 0.9rem; } .list-card span { color: var(--muted); font-size: 0.82rem; }
.toggle-nav { display: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); height: auto; }
  .side { border-right: 0; border-bottom: 1px solid var(--line); max-height: none; }
  .nav { max-height: 46vh; }
  .side.collapsed .nav, .side.collapsed .search { display: none; }
  .toggle-nav { display: inline-block; margin: 0 12px 10px; }
  .main { overflow: visible; }
  .page { padding-inline: 16px; padding-block: 20px 60px; }
  .page h1 { font-size: 1.6rem; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><b>스펙 오디세이 코드 해설서</b><span id="commit">main</span></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="guide" aria-selected="true">해설</button>
      <button class="tab" role="tab" data-view="files" aria-selected="false">파일 전체</button>
      <button class="tab" role="tab" data-view="tables" aria-selected="false">DB 테이블</button>
      <button class="tab" role="tab" data-view="fr" aria-selected="false">요구사항</button>
      <button class="tab" role="tab" data-view="docs" aria-selected="false">개발일지·문서</button>
    </div>
    <button class="btn toggle-nav" id="toggleNav" type="button">목록 접기</button>
    <div class="search"><label for="q" class="eyebrow" style="display:block;margin-bottom:4px">찾기</label><input id="q" type="search" placeholder="파일·클래스·설명·URL로 찾기" autocomplete="off"></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main" id="main"><div class="page" id="page"></div></main>
</div>

<template id="guide-tpl">
<p class="eyebrow">처음 읽는 사람을 위한 안내</p>
<h1>스펙 오디세이를 코드로 이해하기</h1>
<p class="lede">이 해설서는 저장소의 <b>모든 코드 파일</b>을 담고 있습니다. 왼쪽 <b>파일 전체</b> 탭에서 어떤 파일이든 열면 역할 설명, 누가 부르는지, 무엇을 부르는지, 어떤 테스트가 검사하는지, 관련 요구사항, 원본 코드 전체가 나옵니다. 설명은 팀이 코드에 직접 남긴 주석에서 뽑았고, 연결 관계는 코드를 분석해 계산했습니다. 이 장은 그 파일들을 <b>흐름 순서</b>로 엮어 읽는 길잡이입니다.</p>
<div class="stats" id="stats"></div>

<div class="callout info"><b>읽는 순서 추천</b>
1장(지도) → 2장(요청 하나의 여행) → 4·5·6장(직무 찾기 → 격차 분석 → 로드맵, 서비스의 핵심) → 나머지는 필요할 때. 본문의 <span class="mono">파란 파일 이름</span>을 누르면 그 파일이 열립니다. 14장 <b>"발표 전에 바로잡을 것"</b>은 꼭 읽어 주세요.</div>

<h2 id="g1">1. 프로젝트 지도 — 어디에 무엇이 있나</h2>
<p>스펙 오디세이는 <b>프레임워크 없이</b> JSP/Servlet(jakarta)로 만든 웹 서비스입니다. Spring이 대신해 주는 일(요청 연결, 트랜잭션, 보안)을 팀이 직접 규칙으로 만들고, 그 규칙을 테스트로 지키게 했습니다. 코드는 아래 다섯 층으로 나뉩니다.</p>
<div class="tscroll"><table>
<thead><tr><th>층</th><th>폴더</th><th>하는 일</th><th>지키는 규칙</th></tr></thead>
<tbody>
<tr><td>화면</td><td class="mono">webapp/WEB-INF/views</td><td>JSP — 받은 값을 HTML로 출력만</td><td>스크립틀릿 금지, 출력은 <code>&lt;c:out&gt;</code>·<code>fn:escapeXml</code>로 이스케이프(XSS)</td></tr>
<tr><td>컨트롤러</td><td class="mono">controller</td><td>서블릿(요청 받기·응답) + 필터(모든 요청 공통 처리)</td><td>비즈니스 판단은 서비스로 넘긴다. 항상 세션의 본인 id만 쓴다</td></tr>
<tr><td>서비스</td><td class="mono">service</td><td>비즈니스 로직 — 점수 계산, 로드맵 생성, 매칭</td><td>여러 테이블을 바꾸면 <a class="f" data-f="src/main/java/com/specodyssey/util/TransactionUtil.java">TransactionUtil</a>로 한 트랜잭션</td></tr>
<tr><td>DAO</td><td class="mono">dao</td><td>DB 접근 — SQL은 여기에만</td><td>PreparedStatement만(SQL 인젝션 방지), 논리 삭제(<code>is_deleted</code>)</td></tr>
<tr><td>DTO</td><td class="mono">dto</td><td>층 사이에 데이터를 실어 나르는 객체</td><td>JSP가 읽는 record는 Tomcat 10/11 모두 읽히게(<a class="f" data-f="src/main/java/com/specodyssey/util/RecordElResolver.java">RecordElResolver</a>)</td></tr>
</tbody></table></div>
<p>그 밖에 <span class="mono">util</span>(DB 연결, 비밀번호 해시, 외부 API 호출, 스케줄러 같은 공용 도구), <span class="mono">sql</span>(스키마·시드·변경 스크립트), <span class="mono">desktop-companion</span>(바탕화면 캐릭터 프로그램, 별도 Java 앱), <span class="mono">src/test</span>(자동 테스트)가 있습니다.</p>

<h2 id="g2">2. 요청 하나의 여행 — 브라우저에서 DB까지</h2>
<p>사용자가 <code>/roadmap</code>을 열 때 일어나는 일을 순서대로 따라갑니다. 다른 화면도 모두 같은 길을 지납니다.</p>
<div class="flow"><span class="box">브라우저</span><span class="arr">→</span><span class="box">Tomcat (UTF-8 설정)</span><span class="arr">→</span><span class="box hot">필터들</span><span class="arr">→</span><span class="box hot">서블릿</span><span class="arr">→</span><span class="box hot">서비스</span><span class="arr">→</span><span class="box hot">DAO</span><span class="arr">→</span><span class="box">커넥션 풀 → MySQL</span><span class="arr">→</span><span class="box">JSP로 forward → HTML</span></div>
<ol class="steps">
<li><b>Tomcat이 요청을 받는다.</b> 한글 깨짐 방지는 프로젝트 코드가 아니라 <b>Tomcat 기본 설정</b>(<code>conf/web.xml</code>의 <code>request-character-encoding UTF-8</code>)이 맡습니다. 그래서 별도 "인코딩 필터"가 없고, 일부 서블릿만 습관처럼 <code>req.setCharacterEncoding("UTF-8")</code>을 한 번 더 부릅니다(POST 서블릿 40개 중 26개). JSP 파일 자체의 인코딩은 <a class="f" data-f="src/main/webapp/WEB-INF/web.xml">web.xml</a>의 <code>jsp-config</code>가 UTF-8로 고정합니다.</li>
<li><b>필터 체인을 통과한다.</b> 모든 요청(<code>/*</code>)에 걸리는 필터가 차례로 실행됩니다. 아래 표 참고.</li>
<li><b>서블릿이 요청을 받는다.</b> <code>@WebServlet("/roadmap")</code>이 붙은 <a class="f" data-f="src/main/java/com/specodyssey/controller/RoadmapServlet.java">RoadmapServlet</a>이 세션에서 로그인 사용자 id를 꺼내 서비스에 넘깁니다. URL 파라미터로 다른 사람의 id를 받지 않습니다.</li>
<li><b>서비스가 판단한다.</b> <a class="f" data-f="src/main/java/com/specodyssey/service/RoadmapService.java">RoadmapService</a>가 진행도 계산, 잠금 판단 등을 하고 필요한 데이터는 DAO에 요청합니다.</li>
<li><b>DAO가 SQL을 실행한다.</b> <a class="f" data-f="src/main/java/com/specodyssey/util/DBUtil.java">DBUtil</a>이 HikariCP 커넥션 풀에서 연결을 빌려 주고, <code>try-with-resources</code>의 <code>close()</code>가 풀에 돌려줍니다. 풀 도입으로 대시보드 응답이 6.4초에서 1.1초가 됐습니다(<span class="mono">docs/performance.md</span>).</li>
<li><b>JSP로 넘겨 출력한다.</b> 서블릿이 결과를 요청 속성에 담아 <code>/WEB-INF/views/roadmap.jsp</code>로 forward합니다. <code>WEB-INF</code> 아래라 브라우저가 JSP를 직접 열 수 없습니다.</li>
<li><b>상태를 바꾸는 요청(POST)은 처리 후 redirect한다(PRG 패턴).</b> 새로고침해도 같은 POST가 다시 실행되지 않게 합니다.</li>
</ol>
<h3>필터 한눈에 보기</h3>
<p>필터는 모두 <code>@WebFilter</code> 애너테이션으로 등록돼 있습니다. <b>web.xml에 <code>filter-mapping</code>이 없어서 실행 순서가 서블릿 명세상 정해져 있지 않습니다.</b> 그래서 각 필터는 앞의 필터를 믿지 않고 스스로 확인합니다. 예를 들어 <a class="f" data-f="src/main/java/com/specodyssey/controller/RoleFilter.java">RoleFilter</a>는 세션에 로그인 사용자가 없으면 그냥 통과시키고, 로그인 확인은 <a class="f" data-f="src/main/java/com/specodyssey/controller/SessionFilter.java">SessionFilter</a>에 맡깁니다.</p>

<h2 id="g3">3. 가입 · 로그인 · 계정 보안</h2>
<p>관련 파일: <a class="f" data-f="src/main/java/com/specodyssey/controller/RegisterServlet.java">RegisterServlet</a>, <a class="f" data-f="src/main/java/com/specodyssey/controller/LoginServlet.java">LoginServlet</a>, <a class="f" data-f="src/main/java/com/specodyssey/service/UserService.java">UserService</a>, <a class="f" data-f="src/main/java/com/specodyssey/util/PasswordUtil.java">PasswordUtil</a>, <a class="f" data-f="src/main/java/com/specodyssey/util/LoginThrottle.java">LoginThrottle</a>, <a class="f" data-f="src/main/java/com/specodyssey/util/RecoveryCode.java">RecoveryCode</a></p>
<ul>
<li><b>비밀번호는 Argon2id로 해시</b>합니다. 설정값은 메모리 19MiB, 반복 2회, 병렬 1로 OWASP 권장값입니다. 솔트 16바이트는 해시마다 새로 만들어 PHC 문자열 안에 같이 저장합니다.</li>
<li><b>예전 PBKDF2 해시도 검증은 됩니다.</b> 로그인에 성공하면 <code>PasswordUtil.needsRehash()</code>가 예전 형식인지 보고, 그 자리에서 Argon2id로 다시 해시해 저장합니다. 그래서 데이터 이관 없이 해시 방식을 바꿨습니다.</li>
<li><b>무차별 대입 방지:</b> 같은 (아이디, IP)에서 5번 연속 틀리면 5분 동안 막습니다. 서버 메모리에만 기록해서, 서버를 여러 대로 늘리면 공유 저장소가 필요하다는 한계가 코드 주석에 적혀 있습니다.</li>
<li><b>비밀번호 찾기는 메일 대신 복구 코드</b>를 씁니다. 16자(헷갈리는 0/O/1/I 제외 32종 = 80비트)를 가입 때 한 번만 보여 주고, 서버에는 해시만 둡니다.</li>
<li><b>탈퇴는 30일 유예</b>입니다. 그 안에 다시 로그인하면 취소되고, 지나면 <a class="f" data-f="src/main/java/com/specodyssey/util/WithdrawalPurgeScheduler.java">WithdrawalPurgeScheduler</a>가 매일 자정 개인정보를 지우고 아이디를 비워 재가입할 수 있게 합니다. 행 자체는 논리 삭제 원칙대로 남습니다.</li>
<li><b>CSRF:</b> <a class="f" data-f="src/main/java/com/specodyssey/controller/SecurityHeadersFilter.java">SecurityHeadersFilter</a>가 POST마다 ① Origin(없으면 Referer) 호스트가 같은지 ② 세션 토큰(<code>_csrf</code> 폼 필드 또는 <code>X-CSRF-Token</code> 헤더)이 맞는지 확인합니다. 보안 헤더(nosniff, SAMEORIGIN, same-origin)도 여기서 붙입니다.</li>
</ul>

<h2 id="g4">4. 직무 찾기 — 설문으로 직무 추천</h2>
<p>관련 파일: <a class="f" data-f="src/main/java/com/specodyssey/controller/JobDiscoveryServlet.java">JobDiscoveryServlet</a>(<code>/job-discovery</code>), <a class="f" data-f="src/main/java/com/specodyssey/service/discovery/JobDiscoveryService.java">JobDiscoveryService</a>, <a class="f" data-f="src/main/java/com/specodyssey/service/discovery/JobDiscoveryScorer.java">JobDiscoveryScorer</a>, <a class="f" data-f="src/main/java/com/specodyssey/service/discovery/MajorAffinity.java">MajorAffinity</a>, <a class="f" data-f="src/main/java/com/specodyssey/service/discovery/JobSummaryWriter.java">JobSummaryWriter</a></p>
<p>설문 18문항의 답, 보유 기술, 전공을 합쳐 직무마다 점수를 냅니다. 계산은 <b>LLM 없이 규칙</b>으로 하고, LLM은 추천 이유 문장과 직무 요약을 다듬는 데만 씁니다.</p>
<div class="formula">총점 = (1 − 스펙비중 − 전공비중) × 설문점수 + 스펙비중 × 스펙점수 + 전공비중 × 전공점수

설문점수 = (그 직무 계열 문항 평균 − 1) ÷ 4          ← 1~5점 척도를 0~1로
스펙비중 = 0.5 × min(1, 보유 기술 수 ÷ 5)            ← 기술이 많을수록 스펙을 더 믿는다(최대 0.5)
전공비중 = 0.2 × 전공 확신도   (확신도 0.3 미만이면 0)  ← 전공 신호가 약하면 아예 안 쓴다
기술 유사도 학점: 0.50 이하 0점, 0.85 이상 1점, 그 사이는 직선</div>
<ul>
<li>필수 기술은 가중치 2, 우대 기술은 1로 스펙점수를 계산합니다.</li>
<li>결과는 3~5개이고 <b>직무 계열마다 1개</b>만 넣어 비슷한 직무가 몰리지 않게 합니다.</li>
<li>동점이면 직무 id 순입니다. <b>같은 입력이면 항상 같은 결과</b>가 나오게 하려는 것입니다.</li>
<li>전공 배지는 확신도 0.5 이상이고 전공 점수 0.8 이상일 때만 보입니다.</li>
</ul>

<h2 id="g5">5. 격차 분석과 기술명 매칭</h2>
<p>관련 파일: <a class="f" data-f="src/main/java/com/specodyssey/service/GapAnalysisService.java">GapAnalysisService</a>, <a class="f" data-f="src/main/java/com/specodyssey/service/HybridSkillMatcher.java">HybridSkillMatcher</a>, <a class="f" data-f="src/main/java/com/specodyssey/service/EmbeddingMatcher.java">EmbeddingMatcher</a>, <a class="f" data-f="src/main/java/com/specodyssey/service/FuzzyNameMatcher.java">FuzzyNameMatcher</a>, <a class="f" data-f="src/main/java/com/specodyssey/service/RankFusion.java">RankFusion</a>, <a class="f" data-f="src/main/java/com/specodyssey/util/LocalEmbedder.java">LocalEmbedder</a>, <a class="f" data-f="src/main/java/com/specodyssey/service/SkillCatalog.java">SkillCatalog</a></p>
<ol class="steps">
<li>목표 직무의 요구 기술(<code>JOB_REQUIRED_SKILL</code>)과 내 보유 기술(<code>USER_SKILLS</code>)을 가져옵니다.</li>
<li>보유 기술 중 이미 표준 기술(<code>skill_id</code>)에 연결된 것은 그대로 인정합니다. 직접 입력한 글자(<code>raw_input</code>)만 매칭기에 넣습니다. "Java Spring"처럼 한 칸에 여러 개면 모두 찾습니다(<code>matchAll</code>).</li>
<li>요구 기술마다 <b>MET(갖춤) / MISSING(부족)</b>을 정하고 일치율을 계산해 <code>GAP_ANALYSIS</code>와 <code>GAP_ANALYSIS_ITEM</code>에 <b>한 트랜잭션으로</b> 저장합니다.</li>
<li>분석 당시 직무의 <code>requirement_version</code>을 같이 저장합니다. 나중에 직무 요구 기술이 바뀌면 이 값과 비교해 "로드맵이 낡았다"고 알려 줍니다.</li>
</ol>
<h3>매칭 단계 (앞 단계가 찾으면 뒤는 안 감)</h3>
<div class="flow"><span class="box">① 정확 일치</span><span class="arr">→</span><span class="box">② 별칭 사전 SKILL_ALIAS</span><span class="arr">→</span><span class="box">③ 편집 거리(오타)</span><span class="arr">→</span><span class="box">④ 로컬 임베딩 유사도</span><span class="arr">→</span><span class="box hot">⑤ 못 찾은 것만 RRF 하이브리드</span></div>
<ul>
<li><b>임베딩</b>은 ko-sroberta-multitask(768차원)를 DJL + ONNX Runtime으로 <b>서버 안에서</b> 돌립니다. 기술 마스터와 벡터는 <a class="f" data-f="src/main/java/com/specodyssey/service/SkillCatalog.java">SkillCatalog</a>가 메모리에 한 번 올려 공유합니다.</li>
<li><b>하이브리드(RRF)</b>는 글자 유사도 순위와 의미 유사도 순위를 <code>1 ÷ (60 + 등수)</code>로 합칩니다. 두 방식이 모두 상위 3위 안에 넣은 후보만 인정하고, 글자 유사도 0.45 미만이거나 의미 유사도 0.60 미만이면 버립니다. 짧은 기술명끼리는 임베딩이 잘 못 가르기 때문입니다(Java↔JavaScript 0.805).</li>
<li>정확도는 정답 세트 50개로 측정했습니다. 정확 일치만 쓰면 40%, 하이브리드는 100%이고 엉뚱한 연결은 0건입니다. 다만 이 세트에서 임베딩 단계가 더한 몫은 0이라는 한계가 <span class="mono">docs/matching-accuracy.md</span>에 적혀 있습니다.</li>
</ul>

<h2 id="g6">6. 로드맵 — 생성, 이어 붙이기, 복습</h2>
<p>관련 파일: <a class="f" data-f="src/main/java/com/specodyssey/service/RoadmapService.java">RoadmapService</a>(공개 창구), <a class="f" data-f="src/main/java/com/specodyssey/service/RoadmapGenerator.java">RoadmapGenerator</a>(생성), <a class="f" data-f="src/main/java/com/specodyssey/service/SkillPrerequisiteService.java">SkillPrerequisiteService</a>(순서), <a class="f" data-f="src/main/java/com/specodyssey/service/RoadmapRefresher.java">RoadmapRefresher</a>(바뀐 부분만), <a class="f" data-f="src/main/java/com/specodyssey/service/RoadmapReviewService.java">RoadmapReviewService</a>·<a class="f" data-f="src/main/java/com/specodyssey/service/SpacedRepetition.java">SpacedRepetition</a>(복습), <a class="f" data-f="src/main/java/com/specodyssey/service/RoadmapUpkeepService.java">RoadmapUpkeepService</a>(유지·성장), <a class="f" data-f="src/main/java/com/specodyssey/service/RoadmapSubmissionService.java">RoadmapSubmissionService</a>(제출)</p>
<h3>처음 만들 때 (<code>RoadmapGenerator.generate</code>)</h3>
<ol class="steps">
<li>가장 최근 격차 분석을 가져옵니다. 없으면 "먼저 격차 분석을 하세요"로 막습니다.</li>
<li>이 분석으로 이미 만든 로드맵이 있으면 새로 만들지 않고 그걸 대표로 지정합니다. <code>ROADMAP.gap_analysis_id</code>가 UNIQUE라 한 분석에 로드맵은 하나뿐입니다.</li>
<li><b>이번 라운드 기술 5개</b>(<code>ROUND_SKILL_COUNT</code>)를 고릅니다. 부족 기술을 <b>중요도(필수 2점, 우대 1점)</b> 순으로 담고, 모자라면 LLM(<a class="f" data-f="src/main/java/com/specodyssey/service/SkillDeepenService.java">SkillDeepenService</a>)이 "더 깊게 팔 기술"을 고르게 합니다. LLM이 없거나 실패하면 중요도 순으로 채웁니다.</li>
<li><b>선수관계로 다시 줄 세웁니다.</b> <code>SKILL_PREREQUISITE</code>의 "A 전에 B"를 방향 그래프로 보고 Kahn 위상 정렬을 합니다. 꺼낼 수 있는 것 중 원래 순위가 가장 앞선 것을 먼저 꺼내 중요도 순서를 최대한 지킵니다. 순환이 있어도 멈추지 않고 남은 기술을 원래 순서대로 뒤에 붙입니다.</li>
<li>자격증 단계 2개(직무 자격증 1 + 어학·컴활 같은 공통 자격증 1)와 PROJECT 단계(LLM이 추천한 프로젝트 아이디어)를 입문 티어에 넣습니다.</li>
<li><b>LLM 호출은 DB 트랜잭션을 열기 전에 끝냅니다.</b> 느린 외부 호출이 DB 연결을 물고 있지 않게 하려는 것입니다.</li>
<li>트랜잭션 안에서 기존 대표 로드맵을 비활성화하고, 티어(입문 → 핵심 → 심화 → 전문가) × 라운드 기술마다 단계를 만듭니다. 예전 로드맵에서 같은 기술의 같은 티어를 끝냈으면 <b>완료로 승계</b>합니다(점수는 다시 주지 않음).</li>
<li><b>동시 클릭 대비:</b> LLM 호출 몇 초 사이에 같은 요청이 두 번 들어오면 둘 다 INSERT를 시도합니다. 실제로 2026-10-06에 500 오류가 났습니다. 지금은 UNIQUE 위반을 잡아서 먼저 들어간 로드맵을 돌려줍니다.</li>
</ol>
<h3>계단식 잠금과 진행도</h3>
<p>잠금은 DB에 저장하지 않고 <b>조회할 때마다 계산</b>합니다(<a class="f" data-f="src/main/java/com/specodyssey/service/RoadmapProgressCalculator.java">RoadmapProgressCalculator</a>). 앞 티어를 다 끝내야 다음 티어가 열립니다.</p>
<h3>"바뀐 부분만 다시 만들기"</h3>
<p><a class="f" data-f="src/main/java/com/specodyssey/service/RoadmapRefreshPlan.java">RoadmapRefreshPlan</a>이 지금 단계와 새 분석을 비교해 뺄 것, 넣을 것, 순서를 <b>순수 계산</b>으로 정하고(DB 없이 테스트 가능), <a class="f" data-f="src/main/java/com/specodyssey/service/RoadmapRefresher.java">RoadmapRefresher</a>가 반영합니다. 완료한 단계는 지우지 않습니다.</p>
<h3>복습 — SM-2 간격 반복</h3>
<div class="formula">난이도 계수(ease): 기본 2.5, 최소 1.3, 최대 2.8  ← 원래 SM-2에는 상한이 없다
통과 기준: 자기 평가 3 이상. 실패하면 7일 뒤 다시
간격: 최소 1일, 최대 365일. 첫 통과는 원래의 1일·6일 대신 티어 기본 주기</div>
<h3>제출과 자동 판정</h3>
<p>공부 노트 PDF는 텍스트를 꺼내(<a class="f" data-f="src/main/java/com/specodyssey/util/PdfTextUtil.java">PdfTextUtil</a>) <b>규칙</b>으로 판정합니다(<a class="f" data-f="src/main/java/com/specodyssey/service/SkillProofGrader.java">SkillProofGrader</a>): 글자 수, 기술명 언급 횟수, 입문은 코드 블록, 전문가는 외부 링크. 키워드 기준이라 내용 없는 글도 통과할 수 있다는 한계가 팀 결정으로 주석에 적혀 있습니다.</p>

<h2 id="g7">7. 점수 · 등급 · 일일 미션</h2>
<p>관련 파일: <a class="f" data-f="src/main/java/com/specodyssey/service/ScoreService.java">ScoreService</a>, <a class="f" data-f="src/main/java/com/specodyssey/service/ScoringRules.java">ScoringRules</a>, <a class="f" data-f="src/main/java/com/specodyssey/service/StepPointCalculator.java">StepPointCalculator</a>, <a class="f" data-f="src/main/java/com/specodyssey/service/LevelTiers.java">LevelTiers</a>, <a class="f" data-f="src/main/java/com/specodyssey/service/DailyMissionService.java">DailyMissionService</a>, <a class="f" data-f="src/main/java/com/specodyssey/service/MissionSubmitService.java">MissionSubmitService</a>, <a class="f" data-f="src/main/java/com/specodyssey/util/Judge0Client.java">Judge0Client</a>, <a class="f" data-f="src/main/java/com/specodyssey/service/SpecScoreService.java">SpecScoreService</a></p>
<ul>
<li>점수는 <code>SCORE_LOG</code>에 (사용자, 종류, 참조 id, 점수) 한 줄씩 적립하고 등급을 갱신합니다. 같은 일로 두 번 적립되지 않게 참조 id를 함께 남깁니다.</li>
<li>점수 규칙(단계 점수, 라운드 기술 수 5, 복습 주기 등)은 <code>SCORING_RULE</code> 테이블에 있고 관리자 화면에서 바꿉니다. 코드에 같은 기본값이 있어 테이블이 비어도 동작하고, 읽은 값은 1분 동안 메모리에 둡니다.</li>
<li>일일 미션은 등급과 목표 직무에 맞는 문제 3개를 한국 시간 날짜 단위로 배정합니다. 제출 코드는 Judge0로 <b>컴파일만</b> 확인하고 정답 채점은 하지 않습니다.</li>
<li>스펙 점수 스냅샷(<code>SPEC_SCORE_HISTORY</code>)은 매일 자정 전체 사용자에 대해 기록해 대시보드 추이와 면접관 화면의 성장 그래프에 씁니다.</li>
</ul>

<h2 id="g8">8. 면접관 공유 — 지원자가 공개 범위를 쥔다</h2>
<p>관련 파일: <a class="f" data-f="src/main/java/com/specodyssey/service/ShareLinkService.java">ShareLinkService</a>, <a class="f" data-f="src/main/java/com/specodyssey/service/ShareViewService.java">ShareViewService</a>, <a class="f" data-f="src/main/java/com/specodyssey/controller/ShareViewServlet.java">ShareViewServlet</a>(<code>/share/*</code>), <a class="f" data-f="src/main/java/com/specodyssey/controller/ShareDocumentServlet.java">ShareDocumentServlet</a>, <a class="f" data-f="src/main/java/com/specodyssey/service/InterviewerService.java">InterviewerService</a>, <a class="f" data-f="src/main/java/com/specodyssey/service/CompareSort.java">CompareSort</a>, <a class="f" data-f="src/main/java/com/specodyssey/util/SimpleXlsxWriter.java">SimpleXlsxWriter</a></p>
<ul>
<li>토큰은 <code>SecureRandom</code> 32바이트(Base64URL 43자)라 추측할 수 없습니다.</li>
<li><code>/share/*</code>는 로그인 없이 열리는 공개 경로라, <b>접근 제어를 전부 서비스에서</b> 합니다. 토큰 → 활성 여부 → 만료 → 지원자 탈퇴 여부를 확인한 뒤, 링크의 <code>scope_*</code> 9개 중 켜진 범위만 DB에서 읽습니다.</li>
<li>열면 열람 기록을 남기고 지원자에게 알림을 보냅니다. 지원자 본인의 미리보기는 세지 않습니다.</li>
<li>면접관 비교 화면은 지원자가 공개한 값으로만 정렬하고, 공개 안 한 지원자는 맨 뒤로 보냅니다(안정 정렬). 엑셀 내보내기는 라이브러리 없이 <code>java.util.zip</code>으로 .xlsx를 직접 만듭니다.</li>
</ul>

<h2 id="g10">10. 백그라운드 작업 — @WebListener</h2>
<div class="tscroll"><table id="listener-table"><thead><tr><th>리스너</th><th>하는 일</th></tr></thead><tbody></tbody></table></div>
<p>스케줄러들은 공통적으로 "자정에 서버가 꺼져 있었을 경우를 위해 <b>기동 직후에도 한 번</b>, 이미 한 일은 건너뛰게(멱등)" 만들어져 있습니다.</p>

<h2 id="g11">11. 데이터베이스 설계 원칙</h2>
<ul>
<li>테이블 58개, 모든 테이블에 <code>created_at · updated_at · is_deleted</code>. <b>물리 삭제 금지</b>(논리 삭제).</li>
<li>"하나만 있어야 하는 것"은 코드가 아니라 <b>DB 제약(UNIQUE)</b>으로 보장합니다. 예: 한 분석에 로드맵 하나(<code>uk_roadmap_gap_analysis_id</code>), 월별 트렌드 중복 방지(<code>JOB_SKILL_TREND</code> 복합 UNIQUE).</li>
<li>서류 파일은 디스크가 아니라 <code>DOCUMENTS.file_data</code>(LONGBLOB)에 저장합니다. 팀원마다 자기 PC에서 서버를 켜도 같은 공유 DB라 파일이 열리게 하려는 것입니다. 디스크 시절 파일은 <a class="f" data-f="src/main/java/com/specodyssey/util/DocumentBlobBackfill.java">DocumentBlobBackfill</a>이 기동 때 옮깁니다.</li>
<li>스키마는 <span class="mono">sql/01~03</span>, 기본 데이터는 <span class="mono">04~</span>, 변경은 번호 붙은 ALTER 스크립트입니다. 새 DB는 <span class="mono">scripts/init-db.sh</span> 한 번으로 만듭니다(CI도 같은 스크립트).</li>
</ul>
<p>왼쪽 <b>DB 테이블</b> 탭에서 테이블마다 컬럼과 그 테이블을 쓰는 코드를 볼 수 있습니다.</p>

<h2 id="g12">12. 화면(JSP)과 Tomcat 10/11</h2>
<ul>
<li>JSP는 출력만 합니다. 반복·조건은 JSTL(<code>c:forEach</code>, <code>c:if</code>), 값은 EL(<code>${…}</code>). 공통 머리·꼬리는 <span class="mono">views/common/header.jsp · footer.jsp</span>를 include합니다.</li>
<li>Tomcat 10.1(EL 5.0)은 record에서 <code>getX()</code>만, 11(EL 6.0)은 <code>x()</code>만 찾습니다. 그래서 앱 시작 때 <a class="f" data-f="src/main/java/com/specodyssey/util/RecordElResolver.java">RecordElResolver</a>를 등록해 <code>x()</code> → <code>getX()</code> → <code>isX()</code> 순서로 찾게 했습니다.</li>
<li>모든 JSP는 빌드 때 Jasper 11로 미리 컴파일해 검사합니다(<span class="mono">JspCompileTest</span>). 화면을 열어 보기 전에 EL 오류를 잡기 위해서입니다.</li>
</ul>

<h2 id="g13">13. 품질 장치 — 규칙을 빌드가 지킨다</h2>
<p>테스트는 세 종류입니다. ① 순수 계산 단위 테스트(DB 없이), ② 실제 DB를 쓰는 통합 테스트, ③ <b>규칙 자체를 검사하는 테스트</b>. 세 번째가 이 프로젝트의 특징입니다.</p>

<thead><tr><th>검사</th><th>막는 것</th></tr></thead>
<tbody id="rule-tests"></tbody></table></div>
<p>GitHub Actions CI(<span class="mono">.github/workflows/ci.yml</span>)가 푸시마다 빈 MySQL 8에 스키마를 깔고 전체 테스트를 돌립니다.</p>

<h2 id="g14">14. 발표 전에 바로잡을 것 — 코드와 발표 자료가 다른 곳</h2>
<p>해설서를 만들며 코드를 직접 확인한 결과, 발표 명세서·그림과 실제 코드가 다른 곳이 있습니다. 질문에서 걸리지 않게 말을 맞춰 두세요.</p>
<div class="callout warn"><b>① "인코딩 필터"는 없습니다</b>아키텍처 그림의 필터 8개 중 "인코딩"은 프로젝트 필터가 아닙니다. UTF-8 처리는 Tomcat 기본 설정(<code>conf/web.xml</code>의 <code>request-character-encoding</code>)과 일부 서블릿의 <code>setCharacterEncoding</code>, JSP는 <code>web.xml</code>의 <code>jsp-config</code>가 맡습니다. 그림을 고친다면 "인코딩" 칸 대신 실제 필터(예: 알림 배지, D-day 배지, AI 안내)를 넣거나, "인코딩은 Tomcat 설정"으로 표기하세요.</div>
<div class="callout warn"><b>② CSRF는 독립 필터가 아니라 SecurityHeadersFilter 안에 있습니다</b>그림의 "CSRF"와 "보안 헤더"는 한 필터가 같이 합니다. 말할 때 "보안 필터가 CSRF 토큰과 출처 확인, 보안 헤더를 함께 처리한다"고 하면 정확합니다.</div>
<div class="callout warn"><b>③ 필터 실행 순서는 정해져 있지 않습니다</b>필터가 전부 <code>@WebFilter</code>로만 등록돼 있고 web.xml에 순서가 없어서, 서블릿 명세상 순서가 보장되지 않습니다. 각 필터가 스스로 확인하게 짜여 있어 지금 동작에는 문제가 없지만, "필터 체인 순서"를 그림처럼 1→8로 설명하면 질문이 들어올 수 있습니다. "순서에 의존하지 않게 각 필터가 독립적으로 판단한다"고 답하면 됩니다.</div>
<div class="callout warn"><b>④ 로드맵 순서에 "공고 빈도"는 쓰이지 않습니다</b>명세서에는 "중요도 × 공고 빈도로 순위"라고 되어 있지만, 실제 <code>RoadmapGenerator</code>는 <b>중요도(필수 2 / 우대 1)</b>로 정렬하고, 그다음 <b>선수관계 위상 정렬</b>을 합니다. <code>JOB_REQUIRED_SKILL</code>에 빈도 컬럼도 없습니다. 동점끼리는 DB 저장 순서입니다. 발표에서는 "중요도 순으로 고르고 선수관계로 다시 줄 세운다"고 말하세요. (공고 빈도는 직무 요약의 트렌드 근거, 인사이트 화면에서 씁니다.)</div>
<div class="callout warn"><b>⑤ 화면 주소</b>명세서의 <code>/discover</code>, <code>/analysis</code>는 실제로 <code>/job-discovery</code>, <code>/gap-analysis</code>입니다.</div>

    if (t.dataset.jump) { e.preventDefault(); var el2 = document.getElementById(t.dataset.jump); if (el2) el2.scrollIntoView({behavior: 'smooth', block: 'start'}); }
  });
  var qt;
  $('#q').addEventListener('input', function (e) {
    clearTimeout(qt);
    qt = setTimeout(function () { query = e.target.value.trim(); if (view === 'guide' && query) { setView('files'); return; } renderNav(); }, 150);
  });
  $('#toggleNav').addEventListener('click', function () { var s = $('#side'); s.classList.toggle('collapsed'); this.textContent = s.classList.contains('collapsed') ? '목록 펼치기' : '목록 접기'; });

  if (!window.ATLAS) { page('<div class="callout warn"><b>자료 파일이 없습니다</b>같은 폴더에 atlas-data.js가 있어야 합니다.</div>'); return; }
  META = window.ATLAS;
  META.files.forEach(function (f) { byPath[f.p] = f; });
  $('#commit').textContent = 'main ' + (META.commit || '') + ' 기준 · 파일 ' + META.files.length + '개';
  var h0 = (location.hash || '').replace('#', '');
  setView(['guide', 'files', 'tables', 'fr', 'docs'].indexOf(h0) >= 0 ? h0 : 'guide');
})();
</script>
