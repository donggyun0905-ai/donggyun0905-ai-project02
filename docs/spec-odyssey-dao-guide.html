<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스펙 오디세이 DAO 가이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F7F5; --paper-2:#ECEEEA; --card:#FFFFFF; --ink:#17232D; --ink-2:#4B5B67; --ink-3:#7A8791;
  --rule:#D9DDD8; --code-bg:#EEF1EE; --hl:#FFF0C2;
  --sea:#0E1A24; --sea-2:#15252F; --sea-ink:#DCE6EC; --sea-dim:#8198A6; --sea-rule:rgba(255,255,255,.08);
  --g-user:#2E7D6B; --g-job:#B03A48; --g-road:#7A5CB8; --g-mission:#B5841B; --g-eval:#2B6CB0; --g-sys:#5A6472;
  --red:#B03A48; --red-bg:#FBEDEF; --orange:#B8651F; --orange-bg:#FBF1E6; --yellow:#8F6A10; --yellow-bg:#FAF4DF; --green:#2E7D6B; --green-bg:#E9F4F0;
  --sans:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111B22; --paper-2:#17242D; --card:#162029; --ink:#E4ECF0; --ink-2:#A9BAC5; --ink-3:#7F929E;
    --rule:#26343E; --code-bg:#1C2A33; --hl:#4A3E14;
    --red-bg:#3A1E23; --orange-bg:#3A2A1A; --yellow-bg:#352E15; --green-bg:#18332B;
    --red:#F08A96; --orange:#F0A868; --yellow:#E8C660; --green:#6CC9AE;
  }
}
:root[data-theme="dark"]{
  --paper:#111B22; --paper-2:#17242D; --card:#162029; --ink:#E4ECF0; --ink-2:#A9BAC5; --ink-3:#7F929E;
  --rule:#26343E; --code-bg:#1C2A33; --hl:#4A3E14;
  --red-bg:#3A1E23; --orange-bg:#3A2A1A; --yellow-bg:#352E15; --green-bg:#18332B;
  --red:#F08A96; --orange:#F0A868; --yellow:#E8C660; --green:#6CC9AE;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 16px);scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.7;-webkit-text-size-adjust:100%}
a{color:inherit}
code{font-family:var(--mono);font-size:.86em;background:var(--code-bg);padding:.1em .38em;border-radius:4px;white-space:nowrap}
strong{font-weight:600}
:focus-visible{outline:2px solid var(--g-road);outline-offset:2px}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100%}
nav#side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));height:calc(100dvh - env(safe-area-inset-top,0px));overflow-y:auto;background:var(--sea);color:var(--sea-ink);padding:22px 18px 40px;overscroll-behavior:contain}
.brand{margin:0 0 4px;font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand-sub{margin:0 0 18px;font-size:12.5px;color:var(--sea-dim)}
.search{position:relative;margin-bottom:18px}
.search input{width:100%;font:inherit;font-size:14px;color:var(--sea-ink);background:var(--sea-2);border:1px solid var(--sea-rule);border-radius:8px;padding:9px 12px}
.search input::placeholder{color:var(--sea-dim)}
.search input:focus{outline:2px solid #F2C879;outline-offset:1px;border-color:transparent}
.hint{font-size:11.5px;color:var(--sea-dim);margin-top:6px}
.navsec{margin:0 0 18px}
.navsec h2{font-size:12px;font-weight:600;color:var(--sea-dim);margin:0 0 6px;letter-spacing:.01em}
.navsec a{display:block;text-decoration:none;font-size:13.5px;padding:4px 8px;border-radius:6px;color:var(--sea-ink)}
.navsec a:hover{background:var(--sea-2)}
.navsec a.on{background:var(--sea-2);box-shadow:inset 2px 0 0 #F2C879}
.idx-dom{font-size:12px;color:var(--sea-dim);margin:12px 0 4px;display:flex;align-items:center;gap:7px}
.idx-dom i{width:8px;height:8px;border-radius:2px;display:block}
.idx a{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12.5px;padding:3px 8px}
.idx a .used{margin-left:auto;font-family:var(--sans);font-size:10.5px;color:#9FD7C4}
.res{margin:0 0 18px}
.res .rd{font-family:var(--mono);font-size:12.5px;color:var(--sea-ink);margin:10px 0 2px}
.res a{display:block;text-decoration:none;font-family:var(--mono);font-size:12px;color:var(--sea-dim);padding:3px 8px 3px 14px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res a:hover{background:var(--sea-2);color:var(--sea-ink)}
.res .none{font-size:13px;color:var(--sea-dim)}
mark{background:#F2C879;color:#17232D;border-radius:2px;padding:0 1px}

main{padding:40px clamp(18px,5vw,64px) 120px;max-width:1060px}
.hero{border-bottom:1px solid var(--rule);padding-bottom:26px;margin-bottom:10px}
.hero h1{font-size:clamp(26px,3.4vw,34px);line-height:1.25;letter-spacing:-.02em;margin:0 0 12px}
.hero p{margin:0;max-width:68ch;color:var(--ink-2)}
.stats{display:flex;flex-wrap:wrap;gap:22px;margin-top:20px}
.stat{display:flex;flex-direction:column}
.stat b{font-size:22px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink-3)}
section.doc{padding-top:30px}
section.doc>h2{font-size:22px;letter-spacing:-.015em;margin:0 0 14px;padding-top:6px}
.lead{color:var(--ink-2);max-width:70ch;margin:-6px 0 18px}
.prose p{max-width:72ch;margin:0 0 14px}
.prose h3{font-size:16.5px;margin:30px 0 10px;letter-spacing:-.01em}
.prose ul{max-width:72ch;padding-left:1.2em;margin:0 0 14px}
.prose li{margin:4px 0}

/* tables */
.tw{overflow-x:auto;margin:6px 0 18px;border:1px solid var(--rule);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;font-size:12.5px;color:var(--ink-2);background:var(--paper-2);padding:9px 12px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:0}
td code{white-space:nowrap}
td.sig code{background:none;padding:0;font-size:13px;color:var(--ink);font-weight:500}
td.sig{width:34%}
td.sig code{white-space:normal;overflow-wrap:anywhere}  /* 서명이 긴 메서드(MissionDao 등)가 설명 열을 눌러서 행이 너무 높아지던 것 */
td.ret code{background:none;padding:0;color:var(--ink-3)}
tr.flash td{background:var(--hl)}
@media (prefers-reduced-motion:no-preference){tr.flash td{transition:background 1.4s ease}}

/* code */
.code{position:relative;margin:4px 0 18px}
.code pre{margin:0;background:var(--sea);color:#DCE6EC;border-radius:8px;padding:16px 18px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.65}
.copy{position:absolute;top:8px;right:8px;font:inherit;font-size:12px;color:#DCE6EC;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:3px 9px;cursor:pointer}
.copy:hover{background:rgba(255,255,255,.16)}

/* overview grid */
.ov{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px 26px;margin-top:8px}
.ov-d h3{display:flex;align-items:center;gap:8px;font-size:14px;margin:0 0 6px}
.ov-d h3 i{width:10px;height:10px;border-radius:2px;display:block}
.ov-d a{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:baseline;text-decoration:none;padding:5px 0;border-bottom:1px dashed var(--rule)}
.ov-d a:hover .n{text-decoration:underline}
.ov-d .n{font-family:var(--mono);font-size:13px}
.ov-d .o{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);letter-spacing:.06em}
.pill{font-size:11px;padding:1px 7px;border-radius:10px;white-space:nowrap}
.pill.used{background:var(--green-bg);color:var(--green);font-weight:600}
.pill.ready{color:var(--ink-3);border:1px solid var(--rule)}

/* callouts */
.co{border-left:4px solid;border-radius:0 8px 8px 0;padding:14px 18px 4px;margin:0 0 14px}
.co h3{margin:0 0 8px!important;font-size:15.5px}
.co p{max-width:72ch}
.co.red{border-color:var(--red);background:var(--red-bg)} .co.red h3{color:var(--red)}
.co.orange{border-color:var(--orange);background:var(--orange-bg)} .co.orange h3{color:var(--orange)}
.co.yellow{border-color:var(--yellow);background:var(--yellow-bg)} .co.yellow h3{color:var(--yellow)}
.co.green{border-color:var(--green);background:var(--green-bg)} .co.green h3{color:var(--green)}

/* features */
.feat{border-top:1px solid var(--rule)}
.feat>div{display:grid;grid-template-columns:minmax(150px,210px) 1fr;gap:6px 22px;padding:14px 0;border-bottom:1px solid var(--rule)}
.feat h3{margin:0;font-size:14.5px;line-height:1.45}
.feat .st{display:inline-block;margin-top:6px;font-size:11.5px;padding:1px 8px;border-radius:10px;font-weight:600}
.st.s-done{background:var(--green-bg);color:var(--green)}
.st.s-w2{background:var(--orange-bg);color:var(--orange)}
.st.s-later{border:1px solid var(--rule);color:var(--ink-3);font-weight:500}
.feat p{margin:0;max-width:76ch}

/* DAO reference */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px}
.chip{font:inherit;font-size:12.5px;padding:4px 11px;border-radius:14px;border:1px solid var(--rule);background:var(--card);color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:6px}
.chip i{width:8px;height:8px;border-radius:2px;display:block}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.dao{border-left:3px solid;padding:4px 0 6px 18px;margin:0 0 34px}
.dao header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-bottom:6px}
.dao h3{font-family:var(--mono);font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
.dao .tbl{font-size:13.5px;color:var(--ink-2)}
.dao .tbl code{font-size:12.5px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-3);margin:0 0 8px}
.meta b{color:var(--ink-2);font-weight:500}
.dao blockquote{margin:0 0 10px;padding:8px 14px;background:var(--paper-2);border-radius:6px;font-size:14px;color:var(--ink-2);max-width:78ch}
.tx{font-size:11px;padding:1px 6px;border-radius:4px;white-space:nowrap}
.tx.both{background:var(--code-bg);color:var(--ink-2)}
.tx.only{background:var(--orange-bg);color:var(--orange);font-weight:600}
details.dto{margin-top:2px}
details.dto summary{cursor:pointer;font-size:13px;color:var(--ink-2);padding:4px 0;width:fit-content}
details.dto summary code{font-size:12px}
.fields{display:flex;flex-wrap:wrap;gap:4px 6px;margin:6px 0 4px}
.fields span{font-family:var(--mono);font-size:12px;background:var(--card);border:1px solid var(--rule);border-radius:5px;padding:2px 7px}
.fields em{font-style:normal;color:var(--ink-3)}

#menu{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  nav#side{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);height:100%;z-index:30;transform:translateX(-104%);transition:transform .2s ease;padding-top:calc(env(safe-area-inset-top,0px) + 22px)}
  nav#side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  #menu{display:inline-flex;position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;z-index:31;font:inherit;font-size:13px;font-weight:600;color:#DCE6EC;background:var(--sea);border:0;border-radius:8px;padding:8px 13px;cursor:pointer}
  main{padding-top:64px}
  .feat>div{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){nav#side{transition:none}}
</style>
</head>

": "", "void_mut": false}, {"sig": "update(UserSpecDto spec, Long userId)", "name": "update", "ret": "void", "desc": "본인 소유가 아닌 id는 WHERE 조건에서 자연히 걸러진다 (0행 갱신)", "tx": "전용", "void_mut": true}, {"sig": "delete(Long specId, Long userId)", "name": "delete", "ret": "void", "desc": "본인 소유가 아닌 id는 WHERE 조건에서 자연히 걸러진다 (0행 갱신)", "tx": "전용", "void_mut": true}], "dto": "UserSpecDto", "fields": [["id", "Long"], ["userId", "Long"], ["specType", "String"], ["title", "String"], ["issuer", "String"], ["score", "String"], ["acquiredDate", "LocalDate"], ["createdAt", "LocalDateTime"], ["updatedAt", "LocalDateTime"], ["deleted", "boolean"]], "appendonly": false}, {"name": "UserSurveyAnswerDao", "table": "USER_SURVEY_ANSWER", "ko": "설문 응답", "g": "user", "fr": "FR-38 직무 발굴 + 자가진단(TD-5 d)", "note": "자가진단은 초기 1회만 인정하는 정책(docs/db-design.md)이라 수정·삭제는 두지 않는다. 복합 UNIQUE(user_id, question_id) 위반(재응답)은 이 응답을 다루는 서비스가 판단한다.", "used": ["JobDiscoveryService"], "ops": "CR", "rows": [{"sig": "insert(UserSurveyAnswerDto answer)", "name": "insert", "ret": "Long", "desc": "새 행 추가 → 생성된 id 반환", "tx": "✓", "void_mut": false}, {"sig": "findByUserId(Long userId)", "name": "findByUserId", "ret": "List<UserSurveyAnswer>", "desc": "조건 `user_id` → 목록", "tx": "", "void_mut": false}, {"sig": "upsert(UserSurveyAnswerDto answer)", "name": "upsert", "ret": "void", "desc": "직무 발굴 설문 재응답(FR-38). 같은 (user_id, question_id)가 있으면 값만 덮어쓰고, 논리 삭제된 행도 되살린다. JOB_DISCOVERY 문항 전용 — 자가진단(SELF_CHECK)은 초기 1회만 인정하는 정책이라 이 메서드를 쓰면 안 된다.", "tx": "전용", "void_mut": false}], "dto": "UserSurveyAnswerDto", "fields": [["id", "Long"], ["userId", "Long"], ["questionId", "Long"], ["answerValue", "Integer"], ["answeredAt", "LocalDateTime"], ["createdAt", "LocalDateTime"], ["updatedAt", "LocalDateTime"], ["deleted", "boolean"]], "appendonly": true}], "sections": {"skeleton": [{"t": "p", "x": "2주차에 기능을 나눠 만들기 전에 **모든 기능이 공통으로 기대는 코드**를 먼저 만들어뒀습니다. 새 기능은 아래 다섯 가지를 그대로 가져다 쓰면 됩니다. 직접 비슷한 걸 새로 만들지 마세요."}, {"t": "h3", "x": "① TransactionUtil — 여러 테이블을 한 번에 저장할 때"}, {"t": "p", "x": "`com.specodyssey.util.TransactionUtil`. 커넥션 발급, 커밋, 롤백, autoCommit 복구를 전부 대신 해줍니다. **한 요청에서 테이블 두 개 이상을 바꾸면 반드시 이걸로 감싸세요.**"}, {"t": "code", "lang": "java", "x": "Long analysisId = TransactionUtil.runInTransaction(conn -> {\n    Long id = gapAnalysisDao.insert(conn, analysis);\n    for (GapAnalysisItemDto item : items) {\n        item.setGapAnalysisId(id);\n        gapAnalysisItemDao.insert(conn, item);\n    }\n    roadmapDao.insert(conn, roadmap);\n    return id;\n});"}, {"t": "p", "x": "람다 안에서 쓰는 DAO는 반드시 **`Connection`을 받는 버전**이어야 합니다. `gapAnalysisDao.insert(analysis)`처럼 커넥션 없는 버전을 부르면 그 메서드만 따로 새 커넥션을 열어서 트랜잭션 밖에서 저장됩니다."}, {"t": "p", "x": "`SQLException`뿐 아니라 **`NullPointerException` 같은 런타임 예외도 롤백**됩니다. 테스트(`TransactionUtilTest`)로 확인돼 있습니다."}, {"t": "p", "x": "프로필(스펙·프로젝트·스킬)을 바꾸는 코드라면 `ProfileService` 안의 `runInTransaction(userId, …)`을 쓰세요. 이건 `TransactionUtil`을 감싸서 **`USERS.profile_updated_at` 갱신까지 자동으로** 같은 트랜잭션에 넣어줍니다(FR-37 재분석 판단 기준)."}, {"t": "h3", "x": "② ExternalApiClient — 워크넷·LLM·임베딩 API를 부를 때"}, {"t": "p", "x": "`com.specodyssey.util.ExternalApiClient`. HTTP 호출과 JSON 파싱을 담당합니다."}, {"t": "table", "head": ["메서드", "용도"], "rows": [["`get(url)` / `get(url, headers)` / `get(url, headers, timeout)`", "GET 호출 → 응답 본문 문자열"], ["`postJson(url, body)` / `…(url, body, headers)` / `…(url, body, headers, timeout)`", "객체를 JSON으로 바꿔 POST → 응답 본문 문자열"], ["`parseJson(json, Type.class)`", "응답 JSON → 객체. 깨진 JSON이면 `ExternalApiException`"], ["`ExternalApiException.getStatusCode()`", "HTTP 실패면 상태 코드, 네트워크 오류·타임아웃이면 `-1`"]]}, {"t": "p", "x": "**기본 타임아웃은 10초이고 워크넷 기준입니다. LLM을 부를 땐 반드시 타임아웃을 직접 넘기세요.** 긴 응답은 10초를 쉽게 넘깁니다."}, {"t": "code", "lang": "java", "x": "String json = ExternalApiClient.postJson(llmUrl, request, headers, Duration.ofSeconds(60));"}, {"t": "p", "x": "재시도 여부는 상태 코드로 판단합니다. `429`(요청 과다)·`5xx`·`-1`(네트워크)은 잠시 후 재시도가 의미 있고, `400`·`401`은 요청 자체가 틀렸으니 재시도해도 소용없습니다. FR-111의 재시도 버튼을 띄울지 이걸로 정하세요."}, {"t": "p", "x": "**캐시 확인과 실패 시 대체(FR-111·112)는 이 클래스가 안 해줍니다.** 기능마다 정책이 달라서(워크넷 TTL 7일, LLM 수동 갱신) 각 서비스가 `ExternalApiCacheDao`로 직접 처리합니다. 순서는 캐시 조회 → 없거나 만료면 호출 → 성공하면 저장, 실패하면 마지막 캐시로 대체."}, {"t": "p", "x": "예외 메시지에는 URL의 쿼리 문자열이 자동으로 빠집니다. 워크넷 인증키(`authKey=…`)가 로그에 남지 않게 하려는 것이니 메시지를 따로 조립하면서 URL 전체를 다시 넣지 마세요."}, {"t": "h3", "x": "③ SessionFilter — 새 화면은 자동으로 로그인 필요"}, {"t": "p", "x": "**모든 경로가 기본으로 로그인을 요구합니다(화이트리스트 방식).** `/roadmap`, `/analysis` 같은 새 서블릿을 만들면 따로 설정하지 않아도 보호됩니다. 로그인 없이 열어야 하는 경로만 목록에 추가하세요."}, {"t": "table", "head": ["구분", "현재 공개 목록"], "rows": [["정확한 경로 (`PUBLIC_PATHS`)", "`/`, `/index.jsp`, `/login`, `/register`"], ["접두사 (`PUBLIC_PREFIXES`)", "`/css/`, `/js/`, `/img/`, `/share/`"]]}, {"t": "p", "x": "`/share/`는 면접관 공유 링크(FR-85)용으로 미리 열어뒀습니다. 로그인 대신 **`ShareLinkDao.findByToken`이 토큰·활성·만료를 확인**하는 게 접근 제어입니다. 이 아래 서블릿을 만들 때 토큰 확인을 빼먹으면 누구나 열립니다."}, {"t": "h3", "x": "④ 에러 처리 — 서블릿은 예외를 던지기만"}, {"t": "p", "x": "404, 500, 처리되지 않은 예외는 전부 `WEB-INF/views/error.jsp`로 갑니다(`web.xml`). 서블릿에서는 **잡아서 삼키지 말고 메시지를 붙여 다시 던지세요.**"}, {"t": "code", "lang": "java", "x": "} catch (SQLException e) {\n    throw new ServletException(\"로드맵을 불러오는 중 오류가 발생했습니다.\", e);\n}"}, {"t": "p", "x": "다만 이건 **\"예상 못 한 오류\"용**입니다. FR-111의 \"AI 응답 실패 → 오류 메시지 + 재시도 버튼\"은 사용자가 흔히 겪는 정상 흐름이라, 해당 화면 안에서 직접 보여줘야 합니다. 에러 페이지로 보내면 사용자가 하던 작업을 잃습니다."}, {"t": "h3", "x": "⑤ 공통 레이아웃 — 새 JSP는 header/footer로 감싸기"}, {"t": "code", "lang": "jsp", "x": "<%@ page contentType=\"text/html;charset=UTF-8\" language=\"java\" %>\n<%@ taglib prefix=\"c\" uri=\"jakarta.tags.core\" %>\n<c:set var=\"pageTitle\" value=\"로드맵 - 스펙 오디세이\" scope=\"request\" />\n<jsp:include page=\"/WEB-INF/views/common/header.jsp\" />\n\n<h1>내 로드맵</h1>\n...\n\n<jsp:include page=\"/WEB-INF/views/common/footer.jsp\" />"}, {"t": "p", "x": "`footer.jsp` 안에 **FR-54 트렌드 사이드바 자리(`<aside id=\"trend-sidebar\">`)**가 있습니다. 여기 한 곳만 채우면 모든 화면에 반영됩니다. 화면마다 사이드바를 따로 넣지 마세요."}, {"t": "p", "x": "JSP 인코딩은 `web.xml`의 `jsp-config`에서 전체를 UTF-8로 고정했습니다. 새 JSP에 `pageEncoding`을 따로 넣을 필요 없고, include 조각 파일에 한글을 써도 깨지지 않습니다."}], "common": [{"t": "p", "x": "모든 DAO가 아래 약속을 지키도록 작성돼 있습니다. 새 메서드를 추가할 때도 똑같이 맞춰주세요."}, {"t": "p", "x": "**조회는 삭제된 행을 자동으로 뺍니다.** 모든 SELECT에 `is_deleted = FALSE`가 들어 있어서 서비스에서 따로 거를 필요가 없습니다."}, {"t": "p", "x": "**삭제는 전부 논리 삭제입니다.** `delete()`를 불러도 행이 지워지지 않고 `is_deleted = TRUE`로 바뀝니다. 물리 삭제는 테스트 코드(`TestFixtures.hardDelete`)에만 있습니다."}, {"t": "p", "x": "**사용자가 직접 바꾸는 데이터는 모두 `userId`를 같이 받습니다.** `WHERE id = ? AND user_id = ?`로 실행되어, 남의 id를 넣으면 0행이 갱신되고 끝납니다(IDOR 방지). 부모를 거쳐야 소유자를 알 수 있는 `ROADMAP_STEP`은 `ROADMAP`과 JOIN해서 확인합니다. **단, 반환값이 `void`라 0행이었는지 호출한 쪽이 알 수 없습니다** — 6절 특이사항 ①을 꼭 보세요."}, {"t": "p", "x": "**면접관 리소스는 `session_token`으로 소유를 확인합니다.** 면접관은 계정이 없어서(FR-14) `user_id` 대신 `EVALUATION_SESSION.session_token`이 소유 증명입니다."}, {"t": "p", "x": "**append-only 테이블에는 수정·삭제 메서드가 없습니다.** 이력이 목적이라 일부러 막아둔 것이지 빠진 게 아닙니다."}], "handoff": [{"t": "p", "x": "의도적으로 지금 만들지 않고 **그 기능을 만드는 사람에게 넘긴 것**들입니다. 역할을 나눌 때 담당자를 정하고 완료 기준까지 같이 넘기세요. 문서에 적힌 것과 누군가의 할 일 목록에 오른 것은 다릅니다."}, {"t": "table", "head": ["항목", "넘겨받는 사람", "완료 기준"], "rows": [["**재수집 동기화 전략** — `JobRequiredSkillDao`, `JobSkillTrendDao`, `ExternalApiCacheDao`, `TrendTechJobDao`", "워크넷·캐시 배치 담당", "**같은 배치를 연속 두 번 돌려도 성공** + 이번 수집에서 사라진 기술 처리 방식 결정"], ["**점수 요약 행 생성** — `USER_SCORE_SUMMARY`", "결정됨", "**처음 점수를 적립할 때 생성**으로 확정(`ScoreService.awardWithinTransaction`). 요약 행이 없는 신규 계정도 화면이 깨지지 않게 대시보드가 0점 기준으로 읽는다(2026-10-01 수정)"], ["**캐시 헬퍼 추출 여부**", "`EXTERNAL_API_CACHE`를 쓰는 **두 번째** 서비스 담당", "두 번째 사용처를 만들 때 공통 헬퍼로 뽑을지 결정"], ["**마스터 저장 메서드** — `SkillDao`(insert·임베딩 갱신), `JobAliasDao`(insert)", "임베딩·직무 매칭 담당", "없으면 `USER_SKILLS.skill_id`가 계속 NULL"], ["**자격증 직무별 조회** — `CertificationDao`", "로드맵 담당", "`job_category IN (:target, 'COMMON')` 조건 포함"], ["**기술 글 게시판·프로젝트 문서 DAO** — `TECH_ARTICLE`·`_COMMENT`·`_LIKE`·`_BOOKMARK`·`_VIEW_LOG`·`_REPORT`, `PROJECT_TECH_NOTE`, `PROJECT_DOCUMENT_ITEM` (스키마만 있고 DAO는 아직 없음)", "게시판 담당 (팀 회의 후)", "하트·북마크 취소는 **행 되살리기**(`EvaluationSessionItemDao.restore` 방식), `*_count`는 하트·댓글·북마크와 **같은 트랜잭션**에서 갱신, 조회수는 `TECH_ARTICLE_VIEW_LOG` INSERT가 성공했을 때만 +1"], ["**기술 글 게시판·프로젝트 문서 DAO** — `TECH_ARTICLE`·`_COMMENT`·`_LIKE`·`_BOOKMARK`·`_VIEW_LOG`·`_REPORT`, `PROJECT_TECH_NOTE`, `PROJECT_DOCUMENT_ITEM` (스키마만 있고 DAO는 아직 없음)", "게시판 담당 (팀 회의 후)", "하트·북마크 취소는 **행 되살리기**(`EvaluationSessionItemDao.restore` 방식), `*_count`는 하트·댓글·북마크와 **같은 트랜잭션**에서 갱신, 조회수는 `TECH_ARTICLE_VIEW_LOG` INSERT가 성공했을 때만 +1"], ["**기술 글 게시판·프로젝트 문서 DAO** — `TECH_ARTICLE`·`_COMMENT`·`_LIKE`·`_BOOKMARK`·`_VIEW_LOG`·`_REPORT`, `PROJECT_TECH_NOTE`, `PROJECT_DOCUMENT_ITEM` (스키마만 있고 DAO는 아직 없음)", "게시판 담당 (팀 회의 후)", "하트·북마크 취소는 **행 되살리기**(`EvaluationSessionItemDao.restore` 방식), `*_count`는 하트·댓글·북마크와 **같은 트랜잭션**에서 갱신, 조회수는 `TECH_ARTICLE_VIEW_LOG` INSERT가 성공했을 때만 +1"]]}, {"t": "h3", "x": "재수집은 왜 UPSERT만으로 부족한가"}, {"t": "p", "x": "복합 UNIQUE가 걸린 테이블에 같은 키를 다시 `insert`하면 `SQLIntegrityConstraintViolationException`이 납니다. **첫 실행은 성공하고 두 번째부터 실패**하기 때문에 한 번만 돌려보면 안 잡힙니다."}, {"t": "p", "x": "UPSERT(`INSERT … ON DUPLICATE KEY UPDATE`)로 충돌은 막지만, **이번 주 공고에서 사라진 기술은 테이블에 계속 남습니다.** 더 이상 요구되지 않는 기술이 격차 분석에 \"부족\"으로 계속 잡히는 거죠. 덮어쓰기 / 전체 삭제 후 재삽입 / 안 보인 행 비활성화 중 무엇을 쓸지는 배치를 설계하는 사람이 정해야 합니다."}, {"t": "h3", "x": "점수 요약 행은 왜 지금 안 만드나"}, {"t": "p", "x": "`LEVEL_TIER`가 비어 있어서 지금 만들면 `current_tier_id`가 NULL인 반쪽 행이 됩니다. 첫 등급을 무엇으로 줄지(TD-5 d, 자가진단 + 스펙으로 산정)는 점수 기능의 로직입니다. \"처음 조회할 때 생성\"을 고르면 회원가입 코드를 안 건드려도 되고 이미 가입한 사람의 백필도 필요 없습니다. \"가입 시 생성\"을 고르면 `UserService.register`를 `TransactionUtil`로 감싸야 합니다(지금은 insert 하나라 트랜잭션이 아님)."}], "notes": [{"t": "p", "x": "코드를 읽어야만 알 수 있는, **모르고 쓰면 버그가 되는 동작**들입니다. 중요한 순서로 정리했습니다."}, {"t": "callout", "lv": "red", "title": "① 수정·삭제 메서드 36개가 void — 성공 여부를 모릅니다", "x": "남의 id를 넣으면 0행이 갱신되고 **예외 없이 조용히 끝납니다.** 데이터는 안전하지만 호출한 쪽은 성공했다고 믿습니다. 여기에 후속 작업이 붙으면 문제가 됩니다.\n\n예를 들어 로드맵 단계 완료 후 `ScoreLogDao.insert`로 +100점을 주는 코드를 짜면, **다른 사람의 stepId를 넣어도 수정은 안 되는데 점수는 들어갑니다.** `SCORE_LOG`의 UNIQUE는 `(user_id, signal_type, ref_id)`라서 남의 stepId마다 새 적립으로 인정됩니다. 점수를 무한히 쌓는 경로가 됩니다.\n\n**점수와 연결되는 갱신은 `int`(영향받은 행 수)를 돌려주는 것만 쓰세요.** `RoadmapStepDao.updateCompleted`는 이미 `int`로 바뀌어 `RoadmapService.completeStep`이 1행 이상 갱신됐을 때만 점수를 줍니다. 일일 미션 제출·실패는 `MissionDao.saveSubmission`·`markFailed`(`int`)로 처리합니다. `UserDailyMissionDao.updateCompleted`는 아직 `void`라서, 이걸 점수와 엮으려면 먼저 `int`로 바꿔야 합니다. (2026-10-01 현황)"}, {"t": "callout", "lv": "orange", "title": "② 사용자 수정 메서드 4개는 Connection 전용", "x": "`RoadmapStepDao.updateCompleted`, `UserDailyMissionDao.updateCompleted`, `JobRecommendationDao.updateSelected`, `RoadmapDao.updateActiveAndPrimary`는 커넥션을 받는 버전만 있습니다. **반드시 `TransactionUtil.runInTransaction` 안에서** 부르세요. 파라미터 순서는 `(conn, id, userId, …)`로 id 바로 뒤에 userId가 옵니다."}, {"t": "callout", "lv": "orange", "title": "③ 공유 링크 토큰 조회는 \"만료\"와 \"없음\"을 구분하지 않습니다", "x": "`ShareLinkDao.findByToken`은 비활성·만료된 링크를 DAO에서 걸러서 **null을 돌려줍니다.** 존재하지 않는 토큰도 null이라, 화면에서 \"만료된 링크입니다\"와 \"잘못된 링크입니다\"를 구분할 수 없습니다. 둘 다 \"유효하지 않은 링크입니다\"로 안내하세요. 구분이 꼭 필요하면 조건 없는 조회 메서드를 따로 추가해야 합니다. `EvaluationSessionDao.findByToken`도 같습니다."}, {"t": "callout", "lv": "orange", "title": "④ LLM 호출은 타임아웃을 직접 지정", "x": "**(2026-10-01 정정)** LLM은 이제 공용 `LlmClient`/`GroqLlmClient` 경로로 부르면 기본 60초 타임아웃과 재시도(`LlmRetryPolicy`)가 이미 들어 있어 따로 넘기지 않아도 됩니다. 아래는 `ExternalApiClient`를 직접 쓸 때(워크넷 등)에 해당합니다.\n\n**(2026-10-01 정정)** LLM은 이제 공용 `LlmClient`/`GroqLlmClient` 경로로 부르면 기본 60초 타임아웃과 재시도(`LlmRetryPolicy`)가 이미 들어 있어 따로 넘기지 않아도 됩니다. 아래는 `ExternalApiClient`를 직접 쓸 때(워크넷 등)에 해당합니다.\n\n**(2026-10-01 정정)** LLM은 이제 공용 `LlmClient`/`GroqLlmClient` 경로로 부르면 기본 60초 타임아웃과 재시도(`LlmRetryPolicy`)가 이미 들어 있어 따로 넘기지 않아도 됩니다. 아래는 `ExternalApiClient`를 직접 쓸 때(워크넷 등)에 해당합니다.\n\n`ExternalApiClient`의 기본 10초는 워크넷 기준입니다. LLM을 인자 없이 부르면 긴 응답에서 줄줄이 타임아웃납니다. `Duration.ofSeconds(60)` 정도를 넘기세요."}, {"t": "callout", "lv": "yellow", "title": "⑤ 워크넷 응답은 XML", "x": "`ExternalApiClient.parseJson`은 JSON 전용이라 워크넷 응답에는 못 씁니다. 응답 문자열을 받아서 XML 파서로 따로 처리해야 합니다."}, {"t": "callout", "lv": "yellow", "title": "⑥ /share/ 아래는 로그인 없이 열립니다", "x": "공개 경로라서 이 아래 서블릿은 **스스로 토큰을 확인해야** 합니다. `/share`(끝 슬래시 없음)는 공개가 아니니 링크는 `/share/{token}` 형태로 만드세요."}, {"t": "callout", "lv": "yellow", "title": "⑦ 자격증 조회에는 COMMON을 같이", "x": "컴활·정보처리기능사 같은 범용 자격증은 `job_category = 'COMMON'`입니다. 직무별로 조회할 때 `IN (:target, 'COMMON')`으로 넣지 않으면 **아무 로드맵에도 안 나오는 죽은 데이터**가 됩니다. 자격증 하나가 한 카테고리에만 속하는 한계(SQLD는 DATA이자 BACKEND)는 로드맵 품질을 보고 N:M으로 바꿀지 판단하세요."}, {"t": "callout", "lv": "green", "title": "⑧ 알아두면 좋은 것", "x": "`SpecScoreHistoryDao.findByMajorAndGrade`는 `is_seed`를 거르지 않습니다 — 시연용 시드와 섞어 평균을 내는 게 현재 의도입니다.\n\n`UserDailyMissionDao.findByUserId`는 **전체 기간**을 돌려줍니다. \"오늘의 미션\"만 필요하면 날짜 조건 메서드를 추가하는 게 낫습니다.\n\n`GapAnalysisItemDao.insert`에 `skillId`가 null이면 NPE 대신 DB가 제약 위반으로 거부합니다. `TransactionUtil` 안이면 깔끔하게 롤백됩니다.\n\n`error.jsp`는 404와 500에 같은 문구를 보여줍니다. 필요하면 상태 코드로 나누세요."}], "tests": [{"t": "p", "x": "테스트는 **H2 같은 가짜 DB가 아니라 실제 MySQL(MariaDB)에 붙는 통합 테스트**입니다. DAO마다 하나씩(38개), 서비스·유틸 테스트까지 합쳐 테스트 파일이 95개 있습니다."}, {"t": "ul", "items": ["신규 DB는 `sql/01_schema.sql` → `03_schema_extended.sql` → `09_schema_skill_alias.sql`로 구조를 만들고, 시드(`02_seed.sql`, `04_seed_extended.sql`, `04_seed_skills.sql`, `05_seed_survey.sql`, `10`·`11` 별칭)를 적용합니다. 이미 만든 DB는 `sql/07`~`14`의 ALTER·마이그레이션이 필요합니다. 공유 DB에 접속할 수 없으면 `sql/schema_snapshot_2026-10-01.sql`로 같은 구조를 만들 수 있습니다(단, 이 스냅샷은 자소서·게시판 이전 기준이라 12~14번을 추가로 적용).", "환경변수 `DB_URL`, `DB_USER`, `DB_PASSWORD` 설정 — 없으면 `DBUtil`이 시작하자마자 실패", "**리눅스의 MySQL/MariaDB는 `lower_case_table_names=1`이 필요합니다.** 코드·시드가 대문자 테이블명(`USERS`)을 쓰는데 윈도우 DB는 대소문자를 구분하지 않기 때문입니다. DB 시간대는 `Asia/Seoul`(+09:00)로 맞추세요 — UTC면 만료 시각 비교 테스트가 9시간 어긋나 실패합니다.", "`./mvnw test` (실행 권한이 없으면 `sh ./mvnw test`)"]}, {"t": "p", "x": "테스트는 끝나면 만든 행을 **물리 삭제**해서 정리합니다. 논리 삭제만 하면 복합 UNIQUE에 걸려 다음 실행이 실패하기 때문입니다. 그래서 **운영 DB에서는 절대 돌리지 마세요.** 개인 로컬 DB나 테스트 전용 DB에서만 실행해야 합니다."}, {"t": "p", "x": "새 DAO 메서드를 추가하면 같은 파일에 테스트를 붙여주세요. 특히 재수집 동기화를 만들 때는 **같은 키로 두 번 호출하는 테스트**, 점수 적립을 만들 때는 **남의 id로 호출했을 때 점수가 안 들어가는 테스트**를 꼭 넣으세요. 둘 다 정상 경로만 테스트하면 안 잡힙니다."}]}, "features": [{"t": "회원가입 (FR-11)", "st": "완료", "x": "`UserDao.insert`. `USER_SCORE_SUMMARY`는 가입 때 만들지 않고 처음 점수를 적립할 때 `ScoreService.awardWithinTransaction`이 만든다(점수 이력이 없는 새 계정은 대시보드가 0점 기준으로 읽는다)."}, {"t": "프로필 수정 (FR-21~25)", "st": "완료", "x": "`ProfileService`가 이미 처리. 스펙·프로젝트·스킬 변경은 `ProfileService.runInTransaction(userId, …)`로 감싸 `profile_updated_at`까지 자동 갱신."}, {"t": "직무 발굴 (FR-34·38·39)", "st": "완료", "x": "`SurveyQuestionDao.findBySurveyType(\"JOB_DISCOVERY\")` → `UserSurveyAnswerDao.insert` → 추천 계산 → **트랜잭션으로 `JobRecommendationDao.insert` 3~5회** → 선택 시 **트랜잭션 안에서** `JobRecommendationDao.updateSelected(conn, id, userId, true)` → 격차 분석으로 연결 — **구현: `JobDiscoveryService`** (2026-10-01 확인) — **구현: `JobDiscoveryService`** (2026-10-01 확인) — **구현: `JobDiscoveryService`** (2026-10-01 확인)"}, {"t": "격차 분석 (FR-31·42)", "st": "완료", "x": "`JobRequiredSkillDao.findByJobId`(요구) + `UserSkillDao.findByUserId`(보유) 대조 → **트랜잭션으로 `GapAnalysisDao.insert` 1회 + `GapAnalysisItemDao.insert` 기술 수만큼** → 조회는 `GapAnalysisDao.findByUserId`(최신순) + `GapAnalysisItemDao.findByGapAnalysisId` — **구현: `GapAnalysisService`** (2026-10-01 확인) — **구현: `GapAnalysisService`** (2026-10-01 확인) — **구현: `GapAnalysisService`** (2026-10-01 확인)"}, {"t": "로드맵 생성 (FR-32·36·37)", "st": "완료", "x": "격차 분석과 같은 트랜잭션에서 `RoadmapDao.insert` + `RoadmapStepDao.insert` 단계 수만큼 → 이전 로드맵은 `RoadmapDao.updateActiveAndPrimary(conn, id, userId, false, false)`. 대시보드는 `RoadmapDao.findPrimaryByUserId` 하나만 보면 됩니다. — **구현: `RoadmapService.generate`** (2026-10-01 확인) — **구현: `RoadmapService.generate`** (2026-10-01 확인) — **구현: `RoadmapService.generate`** (2026-10-01 확인)"}, {"t": "로드맵 단계 완료 (FR-36)", "st": "완료", "x": "**트랜잭션 안에서** `RoadmapStepDao.updateCompleted(conn, stepId, userId, true, now)` → `ScoreLogDao.insert`(+100) → `UserScoreSummaryDao.update`. **점수 적립 전에 6절 특이사항 ①을 반드시 처리하세요.** — **구현: `RoadmapService.completeStep`** (2026-10-01 확인) — **구현: `RoadmapService.completeStep`** (2026-10-01 확인) — **구현: `RoadmapService.completeStep`** (2026-10-01 확인)"}, {"t": "자격증 D-day (FR-71·72)", "st": "완료", "x": "로드맵 CERT 단계 → `CertScheduleDao.findByCertificationId` → `DdayAlertDao.insert`(`cert_schedule_id` 채움) → 조회는 `DdayAlertDao.findByUserId` — **구현: `DdayService`** (2026-10-01 확인) — **구현: `DdayService`** (2026-10-01 확인) — **구현: `DdayService`** (2026-10-01 확인)"}, {"t": "일일 미션 (FR-51~53)", "st": "완료", "x": "`LevelTierDao.findAll`로 등급별 난이도 범위 → `ProblemDao.findByDifficultyLevel` → `UserDailyMissionDao.insert` → 완료 시 트랜잭션으로 `updateCompleted(conn, id, userId, …)` + `ScoreLogDao.insert` + `UserScoreSummaryDao.update` — **구현: `DailyMissionService · MissionSubmitService`** (2026-10-01 확인) — **구현: `DailyMissionService · MissionSubmitService`** (2026-10-01 확인) — **구현: `DailyMissionService · MissionSubmitService`** (2026-10-01 확인)"}, {"t": "데이터 인사이트 (FR-45~48)", "st": "완료", "x": "또래 비교 `SpecScoreHistoryDao.findByMajorAndGrade` · 합격 기준 `JobBenchmarkSpecDao.findByJobId` · 시계열 `JobSkillTrendDao.findByJobId` · 약점 히트맵은 `GapAnalysisItemDao`의 `status = MISSING` 집계 — **구현: `InsightsServlet · JobSkillTrendService`** (2026-10-01 확인) — **구현: `InsightsServlet · JobSkillTrendService`** (2026-10-01 확인) — **구현: `InsightsServlet · JobSkillTrendService`** (2026-10-01 확인)"}, {"t": "트렌드 사이드바 (FR-54·55)", "st": "완료", "x": "`TrendTechJobDao.findByJobId`(내 직무 연관 기술) → `TrendTechDao.findAll`. 화면은 `footer.jsp`의 사이드바 자리 한 곳에만. — **구현: `TrendWidgetFilter · TrendCollectService`** (2026-10-01 확인) — **구현: `TrendWidgetFilter · TrendCollectService`** (2026-10-01 확인) — **구현: `TrendWidgetFilter · TrendCollectService`** (2026-10-01 확인)"}, {"t": "면접관 공유 링크 (FR-85·86)", "st": "완료", "x": "지원자: `ShareLinkDao.insert` / `update`(공개 범위 `scope_*`) / `delete`. 면접관: `/share/{token}` 서블릿에서 `ShareLinkDao.findByToken` → null이면 거부 → `ShareLinkViewLogDao.insert` → `scope_*`에 따라 프로필 조회 — **구현: `ShareLinkService · ShareViewService`** (2026-10-01 확인) — **구현: `ShareLinkService · ShareViewService`** (2026-10-01 확인) — **구현: `ShareLinkService · ShareViewService`** (2026-10-01 확인)"}, {"t": "면접관 비교 뷰 (FR-82·83)", "st": "완료", "x": "`EvaluationSessionDao.insert` → `EvaluationSessionItemDao.insert`로 링크 담기 → `EvaluationCriteriaDao`로 채점 기준. 소유 확인은 전부 `session_token`. — **구현: `InterviewerService (면접관 계정 방식, /interviewer/compare)`** (2026-10-01 확인) — **구현: `InterviewerService (면접관 계정 방식, /interviewer/compare)`** (2026-10-01 확인) — **구현: `InterviewerService (면접관 계정 방식, /interviewer/compare)`** (2026-10-01 확인)"}, {"t": "외부 API 호출 (FR-111·112)", "st": "완료", "x": "`ExternalApiCacheDao.findByTypeAndKey` → 없거나 만료면 `ExternalApiClient` 호출 → 성공하면 저장, 실패하면 마지막 캐시로 대체. 캐시 갱신 방식은 5절 보류 항목. — **구현: `ExternalApiClient · ExternalApiCacheDao`** (2026-10-01 확인) — **구현: `ExternalApiClient · ExternalApiCacheDao`** (2026-10-01 확인) — **구현: `ExternalApiClient · ExternalApiCacheDao`** (2026-10-01 확인)"}], "appendonly": [{"table": "CERT_SCHEDULE", "why": "자격증 시험 일정은 관리자/수집 배치가 채우는 데이터라 읽기 + 등록만 지원한다"}, {"table": "CERTIFICATION", "why": "1주차에는 마스터 데이터만 시드로 채워두고 조회 전용으로만 쓴다"}, {"table": "EXTERNAL_API_CACHE", "why": "캐시 히트 여부 판단이 목적이라 조회 + 신규 적재만 지원한다"}, {"table": "GAP_ANALYSIS", "why": "사용자가 분석을 실행할 때마다 새 스냅샷이 쌓이는 구조라 수정·삭제는 없다(재분석 = 새 행 추가)"}, {"table": "GAP_ANALYSIS_ITEM", "why": "GAP_ANALYSIS 스냅샷의 자식 항목이라 수정·삭제는 없다"}, {"table": "JOB_ALIAS", "why": "1주차에는 마스터 데이터만 시드로 채워두고 조회 전용으로만 쓴다"}, {"table": "JOB_BENCHMARK_SPEC", "why": "LLM이 생성해 채우는 데이터라 읽기 + 등록만 지원한다"}, {"table": "JOB_POSTING", "why": "원티드·고용24 수집 배치가 채우는 데이터라 읽기 + 등록만 지원한다"}, {"table": "JOB_SKILL_TREND", "why": "월별 스냅샷을 쌓아 시간별 변화를 그리는 용도라 수정·삭제는 없다"}, {"table": "LEVEL_TIER", "why": "등급 구간·배점은 데이터로 관리하는 마스터성 데이터라 읽기 + 등록만 지원한다"}, {"table": "PROBLEM", "why": "문제 풀은 AI 생성/링크 추천/관리자 등록으로 채워지는 공용 풀이라 읽기 + 등록만 지원한다"}, {"table": "PROJECT_TECH_NOTE", "why": ""}, {"table": "ROADMAP_STEP", "why": ""}, {"table": "SCORE_LOG", "why": "점수 적립 이력은 감사로그 성격이라 append-only — 수정·삭제는 없다"}, {"table": "SHARE_LINK_VIEW_LOG", "why": "열람 이력은 append-only — 수정·삭제는 없다"}, {"table": "SKILL_ALIAS", "why": "시드로 채워 두는 별칭 사전이라 조회 전용으로만 쓴다"}, {"table": "SPEC_SCORE_HISTORY", "why": "스냅샷을 스택처럼 쌓아 시계열/또래비교를 계산하는 용도라 수정·삭제는 없다"}, {"table": "SURVEY_QUESTION", "why": "문항은 관리자/시드 데이터로 채워지는 마스터성 데이터라 읽기 + 등록만 지원한다"}, {"table": "TREND_TECH", "why": "외부 수집 배치가 채우는 뉴스성 데이터라 읽기 + 등록만 지원한다"}, {"table": "TREND_TECH_JOB", "why": "임베딩 매칭 배치가 채우는 N:M 연결 데이터라 읽기 + 등록만 지원한다"}, {"table": "USER_SURVEY_ANSWER", "why": "자가진단은 초기 1회만 인정하는 정책(docs/db-design"}]}</script>

const DOMKO=Object.fromEntries(G.domains.map(d=>[d.id,d.ko]));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
const slug=s=>s.replace(/[^\w]+/g,'-');

function blocks(bs){
  return bs.map(b=>{
    if(b.t==='p') return '<p>'+fmt(b.x)+'</p>';
    if(b.t==='h3') return '<h3>'+fmt(b.x)+'</h3>';
    if(b.t==='ul') return '<ul>'+b.items.map(i=>'<li>'+fmt(i)+'</li>').join('')+'</ul>';
    if(b.t==='code') return '<div class="code"><button class="copy" type="button">복사</button><pre><code>'+esc(b.x)+'</code></pre></div>';
    if(b.t==='table') return '<div class="tw"><table><thead><tr>'+b.head.map(h=>'<th>'+fmt(h)+'</th>').join('')+'</tr></thead><tbody>'+b.rows.map(r=>'<tr>'+r.map(c=>'<td>'+fmt(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
    if(b.t==='callout') return '<div class="co '+b.lv+'"><h3>'+fmt(b.title)+'</h3>'+b.x.split('\n\n').map(p=>'<p>'+fmt(p)+'</p>').join('')+'</div>';
    return '';
  }).join('');
}

const S=[]; // [id,title,html]
const m=G.meta;
// hero
let hero='<header class="hero"><h1>DAO·DTO 가이드</h1><p>새 기능을 만들 때 어떤 DAO를 어떻게 부르면 되는지, 그리고 모르고 쓰면 버그가 되는 동작을 정리했습니다. 메서드 시그니처는 '+esc(m.date)+' 기준 소스에서 자동 추출해 실제 코드와 일치합니다. 처음이라면 <a href="#skeleton">공용 뼈대</a>와 <a href="#notes">특이사항</a>부터 보세요.</p>'+
 '<div class="stats">'+[[m.daos,'DAO'],[m.dtos,'DTO'],[m.methods,'메서드'],[m.used,'이미 쓰이는 DAO'],[m.tests,'테스트 파일']].map(([n,l])=>'<div class="stat"><b>'+n+'</b><span>'+l+'</span></div>').join('')+'</div></header>';

// overview
let ov='<p class="lead">초록 표시는 1주차 기능이 이미 호출하는 DAO입니다. 나머지는 DAO와 테스트까지 준비돼 있고 부르는 기능만 아직 없습니다. 오른쪽 글자는 지원 연산(C 등록, R 조회, U 수정, D 논리 삭제)입니다.</p><div class="ov">';
G.domains.forEach(d=>{
  const ds=G.daos.filter(x=>x.g===d.id);
  ov+='<div class="ov-d"><h3><i style="background:'+COLOR[d.id]+'"></i>'+esc(d.ko)+'</h3>'+ds.map(x=>'<a href="#dao-'+x.name+'"><span class="n">'+esc(x.name)+'</span><span class="o">'+esc(x.ops)+'</span>'+(x.used.length?'<span class="pill used">사용 중</span>':'<span class="pill ready">준비됨</span>')+'</a>').join('')+'</div>';
});
ov+='</div>';
S.push(['overview','한눈에 보기',ov]);

// common
let cm='<div class="prose">'+blocks(G.sections.common)+'</div><div class="tw"><table><thead><tr><th>수정·삭제가 없는 테이블</th><th>이유</th></tr></thead><tbody>'+G.appendonly.map(a=>'<tr><td><code>'+esc(a.table)+'</code></td><td>'+fmt(a.why)+'</td></tr>').join('')+'</tbody></table></div>';
S.push(['common','공통 규칙',cm]);
S.push(['skeleton','공용 뼈대',('<div class="prose">'+blocks(G.sections.skeleton)+'</div>')]);

// features
const stc={'완료':'s-done','2주차':'s-w2','이후':'s-later'};
let ft='<p class="lead">굵게 표시한 부분은 한 트랜잭션으로 묶어야 하는 작업입니다.</p><div class="feat">'+G.features.map(f=>'<div><div><h3>'+fmt(f.t)+'</h3><span class="st '+(stc[f.st]||'s-later')+'">'+esc(f.st)+'</span></div><p>'+fmt(f.x)+'</p></div>').join('')+'</div>';
S.push(['features','기능별로 어떤 DAO를 쓰나',ft]);
S.push(['handoff','담당자에게 넘기는 항목','<div class="prose">'+blocks(G.sections.handoff)+'</div>']);
S.push(['notes','특이사항','<div class="prose">'+blocks(G.sections.notes)+'</div>']);

// reference
let rf='<p class="lead">트랜잭션 열의 <span class="tx both">겸용</span>은 커넥션을 받는 버전도 있다는 뜻이고, <span class="tx only">전용</span>은 커넥션 버전만 있어 반드시 <code>TransactionUtil</code> 안에서 불러야 한다는 뜻입니다.</p>';
rf+='<div class="filters" role="group" aria-label="도메인 필터"><button class="chip" data-g="all" aria-pressed="true">전체</button>'+G.domains.map(d=>'<button class="chip" data-g="'+d.id+'" aria-pressed="false"><i style="background:'+COLOR[d.id]+'"></i>'+esc(d.ko)+'</button>').join('')+'</div><div id="daos">';
G.daos.forEach(d=>{
  rf+='<article class="dao" id="dao-'+d.name+'" data-g="'+d.g+'" style="border-color:'+COLOR[d.g]+'">'+
   '<header><h3>'+esc(d.name)+'</h3><span class="tbl"><code>'+esc(d.table)+'</code> '+esc(d.ko)+'</span>'+(d.used.length?'<span class="pill used">사용 중</span>':'<span class="pill ready">준비됨</span>')+'</header>'+
   '<div class="meta">'+(d.fr?'<span><b>요구사항</b> '+esc(d.fr)+'</span>':'')+'<span><b>호출하는 곳</b> '+(d.used.length?d.used.map(u=>'<code>'+esc(u)+'</code>').join(' '):'아직 없음')+'</span><span><b>도메인</b> '+esc(DOMKO[d.g])+'</span></div>'+
   (d.note?'<blockquote>'+fmt(d.note)+'</blockquote>':'')+
   '<div class="tw"><table><thead><tr><th>메서드</th><th>반환</th><th>하는 일</th><th>트랜잭션</th></tr></thead><tbody>'+
   d.rows.map((r,i)=>'<tr id="m-'+d.name+'-'+i+'"><td class="sig"><code>'+esc(r.sig)+'</code></td><td class="ret"><code>'+esc(r.ret)+'</code></td><td>'+fmt(r.desc)+'</td><td>'+(r.tx==='전용'?'<span class="tx only">전용</span>':r.tx?'<span class="tx both">겸용</span>':'')+'</td></tr>').join('')+
   '</tbody></table></div>'+
   (d.fields.length?'<details class="dto"><summary><code>'+esc(d.dto)+'</code> 필드 '+d.fields.length+'개 보기</summary><div class="fields">'+d.fields.map(f=>'<span>'+esc(f[0])+' <em>'+esc(f[1])+'</em></span>').join('')+'</div></details>':'')+
   '</article>';
});
rf+='</div>';
S.push(['reference','DAO 상세 레퍼런스',rf]);

const dtoRule=[['`snake_case` 컬럼','`camelCase` 필드','`profile_updated_at` → `profileUpdatedAt`'],['`BIGINT` (NULL 가능)','`Long`','`desired_job_id` → `Long desiredJobId`'],['`DATETIME`','`LocalDateTime`',''],['`DATE`','`LocalDate`',''],['`DECIMAL`','`BigDecimal`','`match_rate`, `similarity_score`'],['`BOOLEAN`','`boolean` / `Boolean`','NULL 가능하면 `Boolean`'],['`is_deleted`','`boolean deleted`','접두어 `is_`가 빠짐 — `isDeleted()`로 읽음']];
S.push(['dto','DTO 필드 규칙','<div class="prose"><p>DTO는 테이블 컬럼을 그대로 옮긴 데이터 객체입니다. 규칙만 알면 컬럼명에서 필드명을 바로 떠올릴 수 있습니다. 각 DTO의 필드는 레퍼런스의 DAO 아래에서 펼쳐 볼 수 있고, 모든 DTO에 공통으로 있는 <code>createdAt</code>, <code>updatedAt</code>, <code>deleted</code>는 생략했습니다.</p></div>'+blocks([{t:'table',head:['DB','Java','예'],rows:dtoRule}])]);
S.push(['tests','테스트 실행','<div class="prose">'+blocks(G.sections.tests)+'</div>']);

document.getElementById('main').innerHTML=hero+S.map(s=>'<section class="doc" id="'+s[0]+'"><h2>'+esc(s[1])+'</h2>'+s[2]+'</section>').join('');
document.getElementById('toc').innerHTML=S.map(s=>'<a href="#'+s[0]+'" data-sec="'+s[0]+'">'+esc(s[1])+'</a>').join('');
document.getElementById('idx').innerHTML=G.domains.map(d=>'<div class="idx-dom"><i style="background:'+COLOR[d.id]+'"></i>'+esc(d.ko)+'</div>'+G.daos.filter(x=>x.g===d.id).map(x=>'<a href="#dao-'+x.name+'">'+esc(x.name.replace(/Dao$/,''))+(x.used.length?'<span class="used">사용 중</span>':'')+'</a>').join('')).join('');

// copy buttons
document.querySelectorAll('.copy').forEach(b=>b.addEventListener('click',async()=>{
  const t=b.nextElementSibling.textContent;
  try{await navigator.clipboard.writeText(t);b.textContent='복사됨';}catch(e){b.textContent='복사 안 됨';}
  setTimeout(()=>b.textContent='복사',1400);
}));

// domain filter
const chips=[...document.querySelectorAll('.chip')];
chips.forEach(c=>c.addEventListener('click',()=>{
  chips.forEach(x=>x.setAttribute('aria-pressed',String(x===c)));
  const g=c.dataset.g;
  document.querySelectorAll('.dao').forEach(a=>a.hidden=!(g==='all'||a.dataset.g===g));
}));

// search
const q=document.getElementById('q'),res=document.getElementById('results'),navbody=document.getElementById('navbody');
const hi=(s,t)=>{const i=s.toLowerCase().indexOf(t);return i<0?esc(s):esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+t.length))+'</mark>'+esc(s.slice(i+t.length));};
q.addEventListener('input',()=>{
  const t=q.value.trim().toLowerCase();
  if(!t){res.hidden=true;navbody.hidden=false;return;}
  let out='',hits=0;
  G.daos.forEach(d=>{
    const dm=(d.name+' '+d.table+' '+d.ko).toLowerCase().includes(t);
    const ms=d.rows.map((r,i)=>[r,i]).filter(([r])=>(r.sig+' '+r.desc).toLowerCase().includes(t));
    if(!dm&&!ms.length) return;
    hits++;
    out+='<div class="rd"><a href="#dao-'+d.name+'" style="padding-left:0;color:inherit">'+hi(d.name,t)+'</a></div>'+(ms.length?ms:d.rows.map((r,i)=>[r,i]).slice(0,0)).map(([r,i])=>'<a href="#m-'+d.name+'-'+i+'" data-row="m-'+d.name+'-'+i+'">'+hi(r.sig,t)+'</a>').join('');
  });
  res.innerHTML=hits?out:'<div class="none">"'+esc(q.value)+'"와 맞는 DAO나 메서드가 없습니다. 영문 메서드명이나 테이블명으로도 찾아보세요.</div>';
  res.hidden=false;navbody.hidden=true;
});
q.addEventListener('keydown',e=>{if(e.key==='Enter'){const a=res.querySelector('a[href]');if(a)a.click();}if(e.key==='Escape'){q.value='';q.dispatchEvent(new Event('input'));}});

// row flash + open filter if hidden
function reveal(id){
  const el=document.getElementById(id); if(!el) return;
  const art=el.closest('.dao'); if(art&&art.hidden){chips[0].click();}
  if(el.tagName==='TR'){el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1600);}
}
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#"]'); if(!a) return;
  const id=a.getAttribute('href').slice(1); reveal(id);
  if(window.innerWidth<=900){side.classList.remove('open');menu.setAttribute('aria-expanded','false');}
});

// mobile drawer
const side=document.getElementById('side'),menu=document.getElementById('menu');
menu.addEventListener('click',()=>{const o=side.classList.toggle('open');menu.setAttribute('aria-expanded',String(o));if(o)q.focus();});

// active section in toc
const links=[...document.querySelectorAll('#toc a')];
const io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){links.forEach(l=>l.classList.toggle('on',l.dataset.sec===en.target.id));}});},{rootMargin:'-20% 0px -70% 0px'});
document.querySelectorAll('section.doc').forEach(s=>io.observe(s));
})();
</script>
</body>
</html>
