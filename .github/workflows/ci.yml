# CI — 푸시·PR마다 새 MySQL에 스키마·기본 데이터를 깔고 전체 테스트를 돌린다 (2026-10-10)
# DB는 scripts/init-db.sh(README "새 DB라면"과 같은 순서)로 만든다. 공유 DB를 건드리지 않는다.
# 비밀 값은 필요 없다 — LLM·임베딩·외부 API 키가 없으면 앱이 대체 동작(캐시·안내 문구)으로 돌고, 테스트도 그 경로를 쓴다.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          TZ: Asia/Seoul            # 앱과 같은 시간대 — NOW()·CURDATE() 기준 날짜가 어긋나지 않게
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=5s --health-timeout=5s --health-retries=30

    env:
      TZ: Asia/Seoul
      DB_URL: jdbc:mysql://127.0.0.1:3306/spec_odyssey?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USER: root
      DB_PASSWORD: ci-root

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: DB 만들기 (스키마 + 기본 데이터)
        run: |
          mysql -h 127.0.0.1 -uroot -p"$DB_PASSWORD" -e \
            "CREATE DATABASE spec_odyssey CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          bash scripts/init-db.sh spec_odyssey -h 127.0.0.1 -uroot -p"$DB_PASSWORD"

      - name: 테스트
        run: ./mvnw -B -ntp test

      - name: 테스트 결과 올리기 (실패했을 때)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7
